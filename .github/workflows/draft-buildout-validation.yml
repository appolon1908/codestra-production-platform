name: Verify pinned draft build-out
on:
  push:
    branches: [chore/draft-buildout-inspection-20260907]
    paths: [.github/workflows/draft-buildout-validation.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 96
            parent: 4b7373c70b89737330e00c8fd01f716522d62e07
            tree: d41fd811867e77e775df927a40457c9f3b86b29d
          - pr: 111
            parent: 76cae3142523201f8c3ed52cc1c95b0d701fa7bb
            tree: 9716d898856892407efa1a32521052b8153aa026
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: corporate_delivery_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d corporate_delivery_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PR_NUMBER: ${{ matrix.pr }}
      PARENT_SHA: ${{ matrix.parent }}
      EXPECTED_TREE: ${{ matrix.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.parent }}
          persist-credentials: false
      - name: Reconstruct exact bounded source delta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess,urllib.request
          from pathlib import Path
          ids=['34af0732eff432e4720b8c031cd3eebd655da36a','7e2d4313d90d40939fbc4b397b09d00745207c0f','f36b863c40f15616c4d3a95d5424c66b14ca3c22','e8a93226f5e42e589f6b3308056beb313728243b','3e0586a601321e036077be67543abd0b17dd4725']
          parts=[]
          for sha in ids:
              request=urllib.request.Request('https://api.github.com/repos/appolon1908-hue/codestra-production-platform/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: row=json.load(response)
              data=base64.b64decode(row['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              parts.append(data)
          packed=b''.join(parts)
          assert hashlib.sha256(packed).hexdigest()=='75f52db4a6ffa373231e65befea9c4731b5d07b2656e4dac2d2dbda2dfec54c6'
          raw=lzma.decompress(packed)
          assert len(raw)==91078
          size=int.from_bytes(raw[:4],'big')
          rows=json.loads(raw[4:4+size]); payload=raw[4+size:]
          row=next(row for row in rows if row['pr']==int(os.environ['PR_NUMBER']))
          assert row['parent']==os.environ['PARENT_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==row['parent']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          patch=payload[row['offset']:row['offset']+row['length']]
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(row['paths'])
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==row['tree']
          if row['pr']==96:
              path=Path('.github/workflows/corporate-delivery-contract.yml')
              old="--health-cmd 'pg_isready -U ci -d corporate_delivery_ci'"
              text=path.read_text()
              assert text.count(old)==1
              path.write_text(text.replace(old, '--health-cmd "pg_isready -U ci -d corporate_delivery_ci"'))
              subprocess.run(['git','add','--',str(path)],check=True)
          row['tree']=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert row['tree']==os.environ['EXPECTED_TREE']
          (Path(os.environ['RUNNER_TEMP'])/'patch-manifest.json').write_text(json.dumps(row))
          print('RECONSTRUCTED_TREE='+row['tree'])
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install source-test dependencies
        run: python -m pip install pytest==9.0.2 PyYAML==6.0.3 'psycopg[binary]==3.2.9' 'PyJWT[crypto]==2.13.0' nats-py==2.15.0 ruff==0.12.10
      - name: Verify corporate delivery and real limited-role PostgreSQL
        if: matrix.pr == 96
        env:
          CORPORATE_DISPOSABLE_DATABASE: 'YES'
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_vicidial_event_ingress.py tests/test_automation_attempts.py tests/test_automation_gateway.py tests/test_calling_event_delivery.py tests/test_automation_business_processes.py tests/test_corporate_call_center_contract.py tests/test_realtime_gateway.py
          CONTROL_PLANE_DATABASE_URL=postgresql://ci:disposable-ci-only@127.0.0.1:5432/corporate_delivery_ci python scripts/verify_corporate_delivery_postgres.py
      - name: Verify OCI shape and canonical startup gates
        if: matrix.pr == 111
        run: |
          set -euo pipefail
          python -m pytest -q vicidial/tests/test_verify_oci_export.py vicidial/tests/test_entrypoint_effect_gates.py
          sh -n vicidial/docker/entrypoint.sh
      - name: Package only verified source replacements
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --check
          python3 - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          spec=json.loads((root/'patch-manifest.json').read_text())
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==spec['tree']
          rows=[]
          with zipfile.ZipFile(root/'verified-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in spec['paths']:
                  p=Path(name)
                  assert p.is_file() and not p.is_symlink()
                  data=p.read_bytes();mode=subprocess.check_output(['git','ls-files','-s','--',name],text=True).split()[0]
                  rows.append({'path':name,'mode':mode,'type':'blob','sha':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(),'sha256':hashlib.sha256(data).hexdigest()})
                  archive.writestr(name,data)
              archive.writestr('verified-manifest.json',json.dumps({'pr':spec['pr'],'parent':spec['parent'],'tree':spec['tree'],'files':rows}))
          print('REMOTE_REFS_CHANGED=NO')
          print('SERVER_CONTACTED=NO')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-draft-${{ matrix.pr }}-${{ github.sha }}
          path: ${{ runner.temp }}/verified-source.zip
          if-no-files-found: error
          retention-days: 3
  store-source-objects:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - pr: 96
            parent: 4b7373c70b89737330e00c8fd01f716522d62e07
            tree: d41fd811867e77e775df927a40457c9f3b86b29d
          - pr: 111
            parent: 76cae3142523201f8c3ed52cc1c95b0d701fa7bb
            tree: 9716d898856892407efa1a32521052b8153aa026
    steps:
      # No checkout or repository-code execution in this write-capable job.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: verified-draft-${{ matrix.pr }}-${{ github.sha }}
          path: ${{ runner.temp }}/verified-draft
      - name: Store exact blobs and tree without commits or ref updates
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
          PARENT_SHA: ${{ matrix.parent }}
          EXPECTED_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request,zipfile
          from pathlib import Path,PurePosixPath
          api='https://api.github.com/repos/appolon1908-hue/codestra-production-platform/'
          def call(path,value=None):
              request=urllib.request.Request(api+path,data=None if value is None else json.dumps(value).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='GET' if value is None else 'POST')
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'verified-draft/verified-source.zip') as archive:
              spec=json.loads(archive.read('verified-manifest.json'))
              assert spec['parent']==os.environ['PARENT_SHA'] and spec['tree']==os.environ['EXPECTED_TREE'] and spec['pr']==int(os.environ['PR_NUMBER'])
              assert 1<=len(spec['files'])<=13
              names=[row['path'] for row in spec['files']]
              assert len(set(names))==len(names) and set(archive.namelist())==set(names)|{'verified-manifest.json'}
              for row in spec['files']:
                  path=PurePosixPath(row['path']);data=archive.read(row['path'])
                  assert not path.is_absolute() and '..' not in path.parts and row['mode'] in ('100644','100755')
                  assert hashlib.sha256(data).hexdigest()==row['sha256']
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['sha']
              for row in spec['files']:
                  result=call('git/blobs',{'encoding':'base64','content':base64.b64encode(archive.read(row['path'])).decode()})
                  assert result['sha']==row['sha']
              parent=call('git/commits/'+spec['parent'])
              tree=call('git/trees',{'base_tree':parent['tree']['sha'],'tree':[{k:row[k] for k in ('path','mode','type','sha')} for row in spec['files']]})
              assert tree['sha']==spec['tree']
              print('VERIFIED_PR='+str(spec['pr'])+' STORED_TREE='+tree['sha'])
          print('REMOTE_REFS_CHANGED=NO')
          print('SERVER_CONTACTED=NO')
          PY
