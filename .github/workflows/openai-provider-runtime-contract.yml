name: OpenAI provider runtime contract

on:
  pull_request:
    branches:
      - release/production-activation
    paths:
      - ".github/workflows/openai-provider-runtime-contract.yml"
      - "deploy/middleware/approved-release-lock.json"
      - "deploy/middleware/compose.openai-provider.yaml"
      - "deploy/middleware/openai-provider-release-lock.json"
      - "docs/OPENAI-PROVIDER-PRODUCTION-ACTIVATION.md"
      - "tools/validate_openai_provider_runtime_contract.py"
      - "tests/test_openai_provider_runtime_contract.py"
  push:
    branches:
      - release/production-activation
    paths:
      - ".github/workflows/openai-provider-runtime-contract.yml"
      - "deploy/middleware/approved-release-lock.json"
      - "deploy/middleware/compose.openai-provider.yaml"
      - "deploy/middleware/openai-provider-release-lock.json"
      - "docs/OPENAI-PROVIDER-PRODUCTION-ACTIVATION.md"
      - "tools/validate_openai_provider_runtime_contract.py"
      - "tests/test_openai_provider_runtime_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-provider-runtime-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: openai-provider-runtime / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Reject unsafe manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          test "${DISPATCH_REF}" = "refs/heads/release/production-activation"
          test "${DISPATCH_ACTOR}" = "${REPOSITORY_OWNER}"

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install bounded validator dependency
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check "PyYAML==6.0.3"

      - name: Validate disabled runtime contract
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/validate_openai_provider_runtime_contract.py
          python3 tools/validate_openai_provider_runtime_contract.py --evidence-output "${RUNNER_TEMP}/openai-provider-runtime-contract.json"
          python3 tests/test_openai_provider_runtime_contract.py
          git diff --check

      - name: Validate Compose schema without starting a service
        run: |
          set -Eeuo pipefail
          docker compose version
          docker compose --profile openai-provider --file deploy/middleware/compose.openai-provider.yaml config --quiet

      - name: Publish secret-free summary
        if: always()
        run: |
          set -Eeuo pipefail
          python3 - "${RUNNER_TEMP}/openai-provider-runtime-contract.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if not path.is_file():
              evidence = {
                  "status": "MISSING",
                  "blockers": ["runtime-contract evidence is missing"],
              }
          else:
              try:
                  evidence = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  evidence = {
                      "status": "INVALID",
                      "blockers": ["runtime-contract evidence is invalid"],
                  }

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a",
              encoding="utf-8",
          ) as summary:
              summary.write("## OpenAI provider runtime contract\n\n")
              summary.write(f"- Result: **{evidence.get('status')}**\n")
              summary.write("- Provider enabled: `false`\n")
              summary.write("- Production changed: `false`\n")
              summary.write("- Runtime contacted: `false`\n")
              summary.write("- Secret values read: `false`\n")
              summary.write("- Secret values recorded: `false`\n")
              summary.write("\n### Blockers\n\n")
              blockers = evidence.get("blockers") or []
              if blockers:
                  for blocker in blockers:
                      summary.write(f"- `{blocker}`\n")
              else:
                  summary.write("- None\n")
          PY

      - name: Upload bounded validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openai-provider-runtime-contract-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/openai-provider-runtime-contract.json
          if-no-files-found: warn
          retention-days: 30
