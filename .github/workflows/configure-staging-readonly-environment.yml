name: Configure staging-readonly environment

on:
  push:
    branches:
      - ops/staging-readonly-authority-20260903
    paths:
      - ".github/workflows/configure-staging-readonly-environment.yml"
      - "tools/configure_staging_readonly_environment.py"
      - "tests/test_configure_staging_readonly_environment.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: configure-staging-readonly-environment
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  source-policy:
    name: staging-readonly environment / source-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Compile and test bounded configuration policy
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/configure_staging_readonly_environment.py
          python3 tests/test_configure_staging_readonly_environment.py
          git diff --check

  configure:
    name: staging-readonly environment / configure
    needs:
      - source-policy
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CODESTRA_REPOSITORY_ADMIN_TOKEN: ${{ secrets.CODESTRA_REPOSITORY_ADMIN_TOKEN }}
      HAS_CODESTRA_REPOSITORY_ADMIN_TOKEN: ${{ secrets.CODESTRA_REPOSITORY_ADMIN_TOKEN != '' }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Configure exact branch policy and safe constants
        id: configure
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          python3 tools/configure_staging_readonly_environment.py \
            --apply \
            --evidence-output "${RUNNER_TEMP}/staging-readonly-environment-configuration.json"

      - name: Publish secret-free configuration summary
        if: always()
        run: |
          set -Eeuo pipefail
          python3 - "${RUNNER_TEMP}/staging-readonly-environment-configuration.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit("environment configuration evidence is missing")
          evidence = json.loads(path.read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## staging-readonly environment configuration\n\n")
              summary.write(f"- Result: **{evidence.get('status')}**\n")
              summary.write(f"- Admin token present: `{os.environ.get('HAS_CODESTRA_REPOSITORY_ADMIN_TOKEN', 'false')}`\n")
              summary.write(f"- Deployment branch policy: `{evidence.get('deployment_branch_policy')}`\n")
              summary.write(f"- Safe variables configured: `{evidence.get('safe_variables_configured')}`\n")
              summary.write("- Secret values read: `false`\n")
              summary.write("- Secret values written: `false`\n")
              summary.write("- Server contacted: `false`\n")
              summary.write("- SSH attempted: `false`\n")
              summary.write("- Production changed: `false`\n")
              if evidence.get("missing_secret"):
                  summary.write(f"- Missing secret: `{evidence['missing_secret']}`\n")
              if evidence.get("error"):
                  summary.write(f"- Blocker: `{evidence['error']}`\n")
          PY

      - name: Upload bounded configuration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staging-readonly-environment-configuration-${{ github.sha }}
          path: ${{ runner.temp }}/staging-readonly-environment-configuration.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed when account configuration did not complete
        if: ${{ steps.configure.outcome != 'success' }}
        run: |
          echo "STAGING_READONLY_ENVIRONMENT_CONFIGURATION=BLOCKED" >&2
          exit 1
