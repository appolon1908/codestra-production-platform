name: Validate production certification authority

on:
  pull_request:
    branches:
      - release/production-activation
    paths:
      - "PRODUCTION-SOURCE-LOCK.yaml"
      - "config/production-certification-authority.v1.json"
      - "tools/reconcile_production_certification.py"
      - "tests/test_production_certification_authority.py"
      - "docs/PRODUCTION-CERTIFICATION-RECONCILIATION.md"
      - ".github/workflows/validate-production-certification-authority.yml"
  push:
    branches:
      - release/production-activation
    paths:
      - "PRODUCTION-SOURCE-LOCK.yaml"
      - "config/production-certification-authority.v1.json"
      - "tools/reconcile_production_certification.py"
      - "tests/test_production_certification_authority.py"
      - "docs/PRODUCTION-CERTIFICATION-RECONCILIATION.md"
      - ".github/workflows/validate-production-certification-authority.yml"
  workflow_dispatch:
    inputs:
      require_complete:
        description: Fail unless every production certification record is complete
        required: true
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CANDIDATE_MATRIX_REPOSITORY: appolon1908-hue/codestra-production-runtime-authority
  CANDIDATE_MATRIX_COMMIT: 470591454b681092cc8fdde57b2a921802dffd3f
  CANDIDATE_MATRIX_PATH: IMMUTABLE-CANDIDATE-MATRIX.yaml

jobs:
  validate-authority:
    name: Validate fail-closed source authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned validator dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: Prepare explicit unavailable external-matrix fixture
        run: |
          set -Eeuo pipefail
          cat > IMMUTABLE-CANDIDATE-MATRIX.yaml <<'YAML'
          schema_version: 1
          status: BLOCKED_EXTERNAL_MATRIX_REQUIRES_PROTECTED_CROSS_REPOSITORY_READ
          deployment_authorized: false
          production_authorized: false
          workloads: []
          YAML
          test -s IMMUTABLE-CANDIDATE-MATRIX.yaml
          test "$(git ls-files --error-unmatch IMMUTABLE-CANDIDATE-MATRIX.yaml 2>/dev/null || true)" = ""

      - name: Compile and run regressions
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/reconcile_production_certification.py
          python3 tests/test_production_certification_authority.py
          git diff --check

      - name: Validate truthful fail-closed evidence
        run: |
          set -Eeuo pipefail
          python3 tools/reconcile_production_certification.py \
            --report "${RUNNER_TEMP}/production-certification-authority.json"

      - name: Upload bounded source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-certification-source-authority-${{ github.sha }}
          path: ${{ runner.temp }}/production-certification-authority.json
          if-no-files-found: error
          retention-days: 30

  protected-complete-gate:
    name: Validate exact external matrix and complete release evidence
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/production-activation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: repository-administration
    steps:
      - name: Check out protected platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact private runtime authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.CANDIDATE_MATRIX_REPOSITORY }}
          ref: ${{ env.CANDIDATE_MATRIX_COMMIT }}
          path: runtime-authority
          token: ${{ secrets.CODESTRA_RUNTIME_AUTHORITY_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and matrix authority
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C runtime-authority rev-parse HEAD)" = "${CANDIDATE_MATRIX_COMMIT}"
          test -s "runtime-authority/${CANDIDATE_MATRIX_PATH}"
          cp "runtime-authority/${CANDIDATE_MATRIX_PATH}" IMMUTABLE-CANDIDATE-MATRIX.yaml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned validator dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: Enforce complete final gate
        if: ${{ inputs.require_complete }}
        run: |
          set -Eeuo pipefail
          python3 tools/reconcile_production_certification.py \
            --require-complete \
            --report "${RUNNER_TEMP}/production-certification-complete.json"

      - name: Validate current fail-closed state without asserting completion
        if: ${{ !inputs.require_complete }}
        run: |
          set -Eeuo pipefail
          python3 tools/reconcile_production_certification.py \
            --report "${RUNNER_TEMP}/production-certification-complete.json"

      - name: Upload bounded protected evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-certification-complete-${{ github.sha }}
          path: ${{ runner.temp }}/production-certification-complete.json
          if-no-files-found: error
          retention-days: 30
