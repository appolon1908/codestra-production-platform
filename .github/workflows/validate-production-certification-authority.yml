name: Validate production certification authority

on:
  pull_request:
    branches:
      - release/production-activation
    paths:
      - "PRODUCTION-SOURCE-LOCK.yaml"
      - "config/production-certification-authority.v1.json"
      - "tools/reconcile_production_certification.py"
      - "tests/test_production_certification_authority.py"
      - "docs/PRODUCTION-CERTIFICATION-RECONCILIATION.md"
      - ".github/workflows/validate-production-certification-authority.yml"
  push:
    branches:
      - release/production-activation
    paths:
      - "PRODUCTION-SOURCE-LOCK.yaml"
      - "config/production-certification-authority.v1.json"
      - "tools/reconcile_production_certification.py"
      - "tests/test_production_certification_authority.py"
      - "docs/PRODUCTION-CERTIFICATION-RECONCILIATION.md"
      - ".github/workflows/validate-production-certification-authority.yml"
  workflow_dispatch:
    inputs:
      require_complete:
        description: Fail unless every production certification record is complete
        required: true
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CANDIDATE_MATRIX_REPOSITORY: appolon1908-hue/codestra-production-runtime-authority
  CANDIDATE_MATRIX_COMMIT: 470591454b681092cc8fdde57b2a921802dffd3f
  CANDIDATE_MATRIX_PATH: IMMUTABLE-CANDIDATE-MATRIX.yaml

jobs:
  validate-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned validator dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: Retrieve exact external immutable candidate matrix
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repository = os.environ["CANDIDATE_MATRIX_REPOSITORY"]
          commit = os.environ["CANDIDATE_MATRIX_COMMIT"]
          source_path = os.environ["CANDIDATE_MATRIX_PATH"]
          if len(commit) != 40 or any(character not in "0123456789abcdef" for character in commit):
              raise SystemExit("candidate matrix commit must be a full lowercase Git SHA")
          url = f"https://raw.githubusercontent.com/{repository}/{commit}/{source_path}"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "codestra-production-certification-authority"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit(f"candidate matrix fetch returned HTTP {response.status}")
                  payload = response.read(4 * 1024 * 1024 + 1)
          except (urllib.error.URLError, TimeoutError) as exc:
              raise SystemExit(f"candidate matrix fetch failed: {exc}") from exc
          if not payload or len(payload) > 4 * 1024 * 1024:
              raise SystemExit("candidate matrix is empty or exceeds the 4 MiB bound")
          destination = Path("IMMUTABLE-CANDIDATE-MATRIX.yaml")
          destination.write_bytes(payload)
          print(f"CANDIDATE_MATRIX_AUTHORITY={repository}@{commit}:{source_path}")
          PY
          test -s IMMUTABLE-CANDIDATE-MATRIX.yaml
          test "$(git ls-files --error-unmatch IMMUTABLE-CANDIDATE-MATRIX.yaml 2>/dev/null || true)" = ""

      - name: Compile and run regressions
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/reconcile_production_certification.py
          python3 tests/test_production_certification_authority.py
          git diff --check

      - name: Validate truthful fail-closed evidence
        run: |
          set -Eeuo pipefail
          python3 tools/reconcile_production_certification.py \
            --report "${RUNNER_TEMP}/production-certification-authority.json"

      - name: Enforce complete final gate on protected manual execution
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_complete }}
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF}" = "refs/heads/release/production-activation"
          python3 tools/reconcile_production_certification.py \
            --require-complete \
            --report "${RUNNER_TEMP}/production-certification-complete.json"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-certification-authority-${{ github.sha }}
          path: ${{ runner.temp }}/production-certification-*.json
          if-no-files-found: warn
          retention-days: 30
