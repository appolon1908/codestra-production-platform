name: Odoo CRM Call Follow-up Automation

on:
  pull_request:
    paths:
      - "odoo_addons/codestra_crm_call_followup_automation/**"
      - "api/call_followup_automation_event_v1.schema.json"
      - "docs/api/CALL_FOLLOWUP_AUTOMATION_OUTBOX_V1.md"
      - "scripts/validate_odoo_crm_call_followup_automation.py"
      - ".github/workflows/odoo-crm-call-followup-automation.yml"
  push:
    branches:
      - "feature/odoo19-call-followup-automation-outbox"
    paths:
      - "odoo_addons/codestra_crm_call_followup_automation/**"
      - "api/call_followup_automation_event_v1.schema.json"
      - "docs/api/CALL_FOLLOWUP_AUTOMATION_OUTBOX_V1.md"
      - "scripts/validate_odoo_crm_call_followup_automation.py"
      - ".github/workflows/odoo-crm-call-followup-automation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: >-
          python -m compileall -q
          odoo_addons/codestra_crm_call_followup_automation
          scripts/validate_odoo_crm_call_followup_automation.py
      - name: Validate automation invariants
        run: >-
          python
          scripts/validate_odoo_crm_call_followup_automation.py
