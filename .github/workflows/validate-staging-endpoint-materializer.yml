name: Validate staging endpoint manifest materializer

on:
  pull_request:
    branches:
      - release/production-activation
    paths:
      - "config/staging-readonly-endpoint-manifest.v1.schema.json"
      - "tools/materialize_staging_readonly_endpoint_manifest.py"
      - "tools/verify_production_certification_evidence.py"
      - "tests/test_materialize_staging_readonly_endpoint_manifest.py"
      - "tests/test_production_certification_evidence.py"
      - ".github/workflows/validate-staging-endpoint-materializer.yml"
  push:
    branches:
      - release/production-activation
    paths:
      - "config/staging-readonly-endpoint-manifest.v1.schema.json"
      - "tools/materialize_staging_readonly_endpoint_manifest.py"
      - "tools/verify_production_certification_evidence.py"
      - "tests/test_materialize_staging_readonly_endpoint_manifest.py"
      - ".github/workflows/validate-staging-endpoint-materializer.yml"

permissions:
  contents: read

concurrency:
  group: staging-endpoint-materializer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned parser
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: Run fail-closed materializer regressions
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            tools/verify_production_certification_evidence.py \
            tools/materialize_staging_readonly_endpoint_manifest.py
          python3 -m unittest \
            tests/test_production_certification_evidence.py \
            tests/test_materialize_staging_readonly_endpoint_manifest.py
          python3 -m json.tool config/staging-readonly-endpoint-manifest.v1.schema.json >/dev/null
          git diff --check
