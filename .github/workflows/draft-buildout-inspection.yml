name: Draft build-out source inspection
on:
  push:
    branches: [chore/draft-buildout-inspection-20260907]
    paths: [.github/workflows/draft-buildout-inspection.yml]
permissions:
  contents: read
  pull-requests: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1c59ce063392db4f5a04294079bb68df4a36fc08
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact source and review snapshots without executing repository code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          repo = 'appolon1908-hue/codestra-production-platform'
          out = Path(os.environ['RUNNER_TEMP']) / 'draft-buildout'
          out.mkdir()
          def get(path):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          base = '1c59ce063392db4f5a04294079bb68df4a36fc08'
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == base
          subprocess.run(['git','branch','source-protected',base], check=True)
          refs = ['source-protected']
          for number in (96,111,129,130,148,152,174,244):
              pr = get(f'pulls/{number}')
              sha = pr['head']['sha']
              subprocess.run(['git','cat-file','-e',sha+'^{commit}'],check=True)
              name = 'source-pr'+str(number)
              subprocess.run(['git','branch',name,sha],check=True)
              refs.append(name)
              snapshot = {k:pr[k] for k in ('number','title','body','state','draft','head','base','mergeable','mergeable_state','auto_merge')}
              for kind, path in [('reviews',f'pulls/{number}/reviews'),('review_comments',f'pulls/{number}/comments'),('comments',f'issues/{number}/comments')]:
                  rows = []
                  for page in range(1,11):
                      part = get(path+f'?per_page=100&page={page}')
                      rows.extend(part)
                      if len(part)<100:
                          break
                  else:
                      raise SystemExit('review pagination exceeded bound')
                  snapshot[kind] = rows
              (out/f'pr-{number}.json').write_text(json.dumps(snapshot,indent=2)+'\n')
              print(f'PR={number} HEAD={sha} DRAFT={pr["draft"]} STATE={pr["state"]}')
          subprocess.run(['git','bundle','create',str(out/'source.bundle'),*refs],check=True)
          print('REPOSITORY_CODE_EXECUTED=NO')
          print('REMOTE_REFS_CHANGED=NO')
          print('SERVER_CONTACTED=NO')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: draft-buildout-${{ github.sha }}
          path: ${{ runner.temp }}/draft-buildout/
          if-no-files-found: error
          retention-days: 3
