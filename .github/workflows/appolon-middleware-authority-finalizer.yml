name: Finalize exact Appolon Middleware authority branch

on:
  push:
    branches:
      - release/appolon-middleware-authority-20260903

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: appolon-middleware-authority-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    name: Remove temporary automation and ready protected PR
    if: >-
      github.repository == 'appolon1908-hue/codestra-production-platform' &&
      !contains(github.event.head_commit.message, '[authority-finalized]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PUSH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out latest exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/appolon-middleware-authority-20260903
          fetch-depth: 0
          persist-credentials: false

      - name: Require complete generated authority binding
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/appolon-middleware-authority-20260903'
          test -f authority-migration-result.json
          test -f config/production-release-tuple.json
          test -f PRODUCTION-SOURCE-LOCK.yaml
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected_sha = '1aa4d505846b7494aff94bec3d7ea68c895e2dd3'
          expected_digest = 'sha256:cec8b5a186866a4ce77a6079cb3ab6fdb2a3487003872e678b9caa90c1ae52e5'
          result = json.loads(Path('authority-migration-result.json').read_text())
          release = json.loads(Path('config/production-release-tuple.json').read_text())
          assert result['source_sha'] == expected_sha
          assert result['image_digest'] == expected_digest
          assert result['builder'] == 'https://github.com/appolon1908-hue/Middleware-/.github/workflows/release.yml@refs/heads/main'
          assert release['middleware_source_sha'] == expected_sha
          assert release['middleware_digest'] == expected_digest
          assert release['middleware_run_id'] == '33767657962'
          assert release['middleware_artifact'] == result['artifact']
          assert release['middleware_sbom_sha256'] == result['sbom_sha256']
          assert release['middleware_provenance_sha256'] == result['provenance_sha256']
          assert release['middleware_openvex_sha256'] == result['openvex_sha256']
          lock = Path('PRODUCTION-SOURCE-LOCK.yaml').read_text()
          assert lock.count('appolon1908-hue/Middleware-') == 1
          assert lock.count('Codestra-SRL/codestra-middleware') == 1
          assert expected_sha in lock
          assert expected_digest in lock
          assert Path('tools/migrate_middleware_authority.py').is_file()
          assert Path('docs/APPOLON_MIDDLEWARE_PRODUCTION_AUTHORITY_MIGRATION_20260903.md').is_file()
          PY
          git diff --check
          python3 -m compileall -q tools

      - name: Remove all one-shot workflows from the final review tree
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/appolon-middleware-authority-migration.yml \
            .github/workflows/appolon-middleware-authority-gate.yml \
            .github/workflows/appolon-middleware-authority-finalizer.yml
          git config user.name 'codestra-authority-bot'
          git config user.email 'appolon1908-hue@users.noreply.github.com'
          git add --all
          git commit -m 'ci: finalize exact authority review tree [authority-finalized]'
          git push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/release/appolon-middleware-authority-20260903

      - name: Ready exact PR and enable protected auto-merge
        run: |
          set -Eeuo pipefail
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head release/appolon-middleware-authority-20260903 \
            --base release/production-activation \
            --state open \
            --json number \
            --jq 'if length == 1 then .[0].number else error("authority PR missing or ambiguous") end')"
          gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY" || true
          gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --add-reviewer kazan555
          gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" --body 'The exact signed Appolon Middleware authority binding is generated, temporary workflows are removed, and this PR is ready for independent exact-head review. Auto-merge remains subject to every required check, an authorized non-author approval, and zero unresolved conversations. No administrator bypass is authorized.'
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --auto --squash
