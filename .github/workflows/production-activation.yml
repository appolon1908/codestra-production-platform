name: Historical production activation — reference only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-only-block:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse central production activation
        run: |
          echo 'REFERENCE_ONLY_REPOSITORY=YES'
          echo 'CENTRAL_PRODUCTION_ACTIVATION=DISABLED'
          echo 'Use each component principal repository and its reviewed deployment/activation path.'
          echo 'Historical workflow implementation remains available in repository history.'
          exit 1
