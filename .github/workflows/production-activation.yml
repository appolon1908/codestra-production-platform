name: Protected production activation

on:
  workflow_dispatch:
    inputs:
      action:
        description: Allowlisted operator action
        required: true
        type: choice
        default: preflight
        options: [preflight, backup, validate-backup, restore-test, stage, canary, status, rollback, collect-evidence]
      protected_sha:
        description: Exact protected platform SHA
        required: true
      image_digest:
        description: Exact immutable middleware digest
        required: true
      change_id:
        description: Approved change identifier
        required: true
        default: CHG-20260821-CODESTRA-PRODUCTION-ACTIVATION-01
      maintenance_date:
        description: Approved date in YYYY-MM-DD
        required: true

permissions:
  contents: read

concurrency:
  group: codestra-production-activation
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.protected_sha }}
          persist-credentials: false
      - name: Require protected source and fixed release tuple
        env:
          ACTION: ${{ inputs.action }}
          PROTECTED_SHA: ${{ inputs.protected_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          CHANGE_ID: ${{ inputs.change_id }}
          MAINTENANCE_DATE: ${{ inputs.maintenance_date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "${PROTECTED_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/release%2Fproduction-activation" --jq .commit.sha)" = "${PROTECTED_SHA}"
          mkdir -m 0700 "${RUNNER_TEMP}/release"
          gh release download "protected-${PROTECTED_SHA}" \
            --repo "${GITHUB_REPOSITORY}" --dir "${RUNNER_TEMP}/release"
          (cd "${RUNNER_TEMP}/release" && sha256sum --check --strict manifest.sha256)
          install -m 0700 -d "${RUNNER_TEMP}/signature"
          printf 'codestra-release %s\n' "${{ secrets.CODESTRA_RELEASE_SIGNING_PUBLIC_KEY }}" \
            > "${RUNNER_TEMP}/signature/allowed_signers"
          ssh-keygen -Y verify -q \
            -f "${RUNNER_TEMP}/signature/allowed_signers" \
            -I codestra-release -n codestra-release \
            -s "${RUNNER_TEMP}/release/manifest.sha256.sig" \
            < "${RUNNER_TEMP}/release/manifest.sha256"
          printf 'SIGNING_PUBLIC_KEY_FINGERPRINT=%s\n' "$(
            printf '%s\n' "${{ secrets.CODESTRA_RELEASE_SIGNING_PUBLIC_KEY }}" |
              ssh-keygen -lf /dev/stdin -E sha256 | awk '{print $2}'
          )"
          python tools/validate_activation_request.py \
            --action "${ACTION}" --sha "${PROTECTED_SHA}" \
            --digest "${IMAGE_DIGEST}" --change-id "${CHANGE_ID}" \
            --maintenance-date "${MAINTENANCE_DATE}" \
            --manifest "${RUNNER_TEMP}/release/deployment-manifest.json"
      - name: Preserve fail-closed result
        run: |
          printf '%s\n' \
            'PSTN_DIALING=DISABLED' \
            'PRODUCTION_DIALING=DISABLED' \
            'CALLS_PLACED=0' \
            'PAYMENT_CHARGES_PERFORMED=0' \
            'CUSTOMER_MESSAGES_SENT=0'

  approved-operation:
    needs: verify
    if: inputs.action != 'preflight' && inputs.action != 'status' && inputs.action != 'collect-evidence'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail closed until narrow host operator is independently installed
        run: |
          echo 'Protected approval recorded; host operator is not yet certified.'
          exit 2
