name: Odoo CRM Call Follow-up UX

on:
  pull_request:
    paths:
      - "odoo_addons/codestra_crm_call_followup_ux/**"
      - "scripts/validate_odoo_crm_call_followup_ux.py"
      - ".github/workflows/odoo-crm-call-followup-ux.yml"
  push:
    branches:
      - "feature/odoo19-call-followup-ux-actions"
    paths:
      - "odoo_addons/codestra_crm_call_followup_ux/**"
      - "scripts/validate_odoo_crm_call_followup_ux.py"
      - ".github/workflows/odoo-crm-call-followup-ux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q odoo_addons/codestra_crm_call_followup_ux scripts/validate_odoo_crm_call_followup_ux.py
      - run: python scripts/validate_odoo_crm_call_followup_ux.py
