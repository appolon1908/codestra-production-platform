name: mail-api-authority
on:
  pull_request:
    paths: [mail_platform/**, deploy/mail-platform/**, .github/workflows/mail-api-authority.yml]
permissions: {contents: read, pull-requests: read}
jobs:
  validate-mail-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m compileall -q mail_platform
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/mail-platform/Dockerfile.api
          load: true
          tags: codestra/mail-api:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: 'codestra/mail-api:${{ github.sha }}', severity: 'CRITICAL,HIGH', ignore-unfixed: true, exit-code: '1'}
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/authority-gitleaks"

      - name: Scan complete source tree for secrets
        run: '"${RUNNER_TEMP}/authority-gitleaks" dir --no-banner --redact --exit-code 1 .'
