name: Odoo Call Follow-up Docker Release

on:
  pull_request:
    paths:
      - "odoo_addons/codestra_crm_call_followup/**"
      - "odoo_addons/codestra_crm_call_followup_api/**"
      - "odoo_addons/codestra_crm_call_followup_ux/**"
      - "odoo_addons/codestra_crm_call_followup_automation/**"
      - "deploy/odoo/call-followup-release/**"
      - "docs/CODEX_ODOO19_CALL_FOLLOWUP_DOCKER_RELEASE.md"
      - "scripts/validate_odoo_call_followup_docker_release.py"
      - ".github/workflows/odoo-call-followup-docker-release.yml"
  push:
    branches:
      - "ops/odoo19-call-followup-docker-release"
    paths:
      - "odoo_addons/codestra_crm_call_followup/**"
      - "odoo_addons/codestra_crm_call_followup_api/**"
      - "odoo_addons/codestra_crm_call_followup_ux/**"
      - "odoo_addons/codestra_crm_call_followup_automation/**"
      - "deploy/odoo/call-followup-release/**"
      - "docs/CODEX_ODOO19_CALL_FOLLOWUP_DOCKER_RELEASE.md"
      - "scripts/validate_odoo_call_followup_docker_release.py"
      - ".github/workflows/odoo-call-followup-docker-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odoo-call-followup-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate all addon contracts
        run: |
          python scripts/validate_odoo_crm_call_followup.py
          python scripts/validate_odoo_crm_call_followup_api.py
          python scripts/validate_odoo_crm_call_followup_ux.py
          python scripts/validate_odoo_crm_call_followup_automation.py
          python scripts/validate_odoo_call_followup_docker_release.py
      - name: Validate shell and Compose
        run: deploy/odoo/call-followup-release/validate.sh
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/gitleaks-bin"
      - name: Scan candidate and report safe finding metadata
        run: |
          report="${RUNNER_TEMP}/gitleaks-report.json"
          set +e
          "${RUNNER_TEMP}/gitleaks-bin" dir \
            --no-banner \
            --redact \
            --exit-code 1 \
            --report-format json \
            --report-path "${report}" \
            .
          status=$?
          set -e
          python - "${report}" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          findings = json.loads(path.read_text()) if path.exists() else []
          for finding in findings:
              print(
                  "GITLEAKS_FINDING="
                  f"{finding.get('RuleID', 'unknown')} "
                  f"{finding.get('File', 'unknown')}:"
                  f"{finding.get('StartLine', 0)}"
              )
          print(f"GITLEAKS_FINDING_COUNT={len(findings)}")
          PY
          exit "${status}"

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build exact candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/odoo/call-followup-release/Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          provenance: false
          sbom: false
          tags: codestra/odoo-call-followup:${{ github.sha }}
          build-args: |
            ODOO_BASE_IMAGE=odoo@sha256:f54272f31d5f77e4146b887efb3761c98480317daf687e4b4b5e76ed8bcc08c5
            VCS_REF=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
      - name: Inspect packaged addons and labels
        run: |
          IMAGE="codestra/odoo-call-followup:${{ github.sha }}"
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${{ github.sha }}"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -ec '
            test -f /opt/codestra/release/call-followup-manifest.json
            test -f /opt/codestra/addons/codestra_crm_call_followup/__manifest__.py
            test -f /opt/codestra/addons/codestra_crm_call_followup_api/__manifest__.py
            test -f /opt/codestra/addons/codestra_crm_call_followup_ux/__manifest__.py
            test -f /opt/codestra/addons/codestra_crm_call_followup_automation/__manifest__.py
          '
