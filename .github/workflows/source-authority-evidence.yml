name: source-authority-evidence

on:
  pull_request:
    paths:
      - reports/CONTROL_PLANE_SOURCE_AUTHORITY_RECONCILIATION_20260901.md
      - scripts/validate_control_plane_authority_evidence.py
      - .github/workflows/source-authority-evidence.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-control-plane-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin agent/middleware-n8n-control-plane
      - run: python3 scripts/validate_control_plane_authority_evidence.py
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/authority-gitleaks"

      - name: Scan complete source tree for secrets
        run: |
          scan_root="${RUNNER_TEMP}/tracked-source"
          mkdir -p "${scan_root}"
          git archive HEAD | tar -x -C "${scan_root}"
          (cd "${scan_root}" && "${RUNNER_TEMP}/authority-gitleaks" dir --no-banner --redact --exit-code 1 .)
