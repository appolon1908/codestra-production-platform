name: PR 223 refresh and redirect hardening

on:
  push:
    branches:
      - fix/private-gateway-outbound-mtls-20260903
    paths:
      - .github/workflows/pr223-refresh-and-fix.yml

permissions:
  contents: write

concurrency:
  group: pr223-refresh-and-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Refresh protected source and apply no-redirect transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/production-activation
          git merge --no-edit origin/release/production-activation
          python3 tools/pr223_apply_no_redirect.py
          python3 -m compileall -q \
            services/private-integration-gateway/gateway.py \
            tests/test_private_integration_gateway.py \
            tools/pr223_apply_no_redirect.py
          git diff --check
          git add \
            services/private-integration-gateway/gateway.py \
            services/private-integration-gateway/README.md \
            tests/test_private_integration_gateway.py
          git rm \
            .github/workflows/pr223-refresh-and-fix.yml \
            tools/pr223_apply_no_redirect.py
          git commit -m "fix(private-gateway): refuse redirects before outbound mTLS"
          git push origin HEAD:fix/private-gateway-outbound-mtls-20260903
