name: Caddy production gate
on:
  pull_request:
    paths: ['operations/caddy/**']
  push:
    paths: ['operations/caddy/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Caddy
      run: sudo apt-get update && sudo apt-get install -y caddy
    - run: operations/caddy/scripts/release-gate.sh
