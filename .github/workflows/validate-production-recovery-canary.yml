name: Validate production recovery canary and soak evidence

on:
  pull_request:
    branches:
      - release/production-activation
    paths:
      - "config/production-recovery-canary-policy.v1.json"
      - "tools/validate_production_recovery_canary.py"
      - "tests/test_production_recovery_canary.py"
      - ".github/workflows/validate-production-recovery-canary.yml"
  push:
    branches:
      - release/production-activation
    paths:
      - "config/production-recovery-canary-policy.v1.json"
      - "tools/validate_production_recovery_canary.py"
      - "tests/test_production_recovery_canary.py"
      - ".github/workflows/validate-production-recovery-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-recovery-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifier-regressions:
    name: Recovery and canary fail-closed regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Compile and test evidence validator
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/validate_production_recovery_canary.py
          python3 -m unittest tests/test_production_recovery_canary.py
          python3 -m json.tool config/production-recovery-canary-policy.v1.json >/dev/null
          git diff --check

  protected-evidence-gate:
    name: Protected recovery canary and soak gate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/production-activation' }}
    needs:
      - verifier-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production-certification-evidence
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Materialize encrypted evidence input
        env:
          RECOVERY_CANARY_EVIDENCE: ${{ secrets.CODESTRA_PRODUCTION_RECOVERY_CANARY_EVIDENCE }}
        run: |
          set -Eeuo pipefail
          test -n "${RECOVERY_CANARY_EVIDENCE}"
          printf '%s' "${RECOVERY_CANARY_EVIDENCE}" > "${RUNNER_TEMP}/production-recovery-canary-evidence.json"
          chmod 0600 "${RUNNER_TEMP}/production-recovery-canary-evidence.json"

      - name: Validate sanitized production evidence
        run: |
          set -Eeuo pipefail
          python3 tools/validate_production_recovery_canary.py \
            --evidence "${RUNNER_TEMP}/production-recovery-canary-evidence.json" \
            --result-output "${RUNNER_TEMP}/production-recovery-canary-result.json"
          rm -f "${RUNNER_TEMP}/production-recovery-canary-evidence.json"

      - name: Upload bounded validation result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-recovery-canary-result-${{ github.sha }}
          path: ${{ runner.temp }}/production-recovery-canary-result.json
          if-no-files-found: error
          retention-days: 30
