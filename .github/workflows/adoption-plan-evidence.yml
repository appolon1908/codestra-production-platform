name: adoption-plan-evidence

on:
  pull_request:
    paths:
      - reports/AMBIGUOUS_WORKLOAD_ADOPTION_PLANS_20260901.md
      - scripts/validate_ambiguous_adoption_plans.py
      - .github/workflows/adoption-plan-evidence.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-adoption-plans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_ambiguous_adoption_plans.py
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \\
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \\
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/authority-gitleaks"

      - name: Scan complete source tree for secrets
        run: '"${RUNNER_TEMP}/authority-gitleaks" dir --no-banner --redact --exit-code 1 .'
