name: Generate exact Appolon Middleware authority binding

on:
  push:
    branches:
      - release/appolon-middleware-authority-20260903
    paths:
      - tools/signed_middleware_release.py
      - tools/migrate_middleware_authority.py
      - tools/verify_middleware_release_evidence.py
      - docs/APPOLON_MIDDLEWARE_PRODUCTION_AUTHORITY_MIGRATION_20260903.md
      - .github/workflows/appolon-middleware-authority-migration.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: appolon-middleware-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bind-exact-release:
    name: Bind exact signed Middleware release
    if: >-
      github.actor == 'appolon1908-hue' &&
      !contains(github.event.head_commit.message, '[authority-generated]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIDDLEWARE_REPOSITORY: appolon1908-hue/Middleware-
      MIDDLEWARE_RELEASE_RUN_ID: '33767657962'
      EXPECTED_SOURCE_SHA: 1aa4d505846b7494aff94bec3d7ea68c895e2dd3
      EXPECTED_IMAGE_DIGEST: sha256:cec8b5a1b0e713857be1dbc94b73780bf9ae1a200d0901f95cb62193b9c2f504
      EXPECTED_ARTIFACT_DIGEST: sha256:cfd5ef83132da1683c0c053e7025739aa4c2747344aa7fc1feed48bf838a566a
      ARTIFACT_TOKEN: ${{ secrets.MIDDLEWARE_RELEASE_TOKEN || secrets.PRODUCTION_RELEASE_GITHUB_TOKEN || secrets.GHCR_TOKEN || github.token }}
      PUSH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/appolon-middleware-authority-20260903
          fetch-depth: 0
          persist-credentials: false

      - name: Reject stale or unexpected branch source
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'appolon1908-hue/codestra-production-platform'
          test "$GITHUB_REF" = 'refs/heads/release/appolon-middleware-authority-20260903'
          test -z "$(git status --porcelain)"
          test -n "$ARTIFACT_TOKEN"

      - name: Download the exact signed release artifact
        env:
          GH_TOKEN: ${{ env.ARTIFACT_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/middleware-release"
          artifacts="$(gh api "repos/${MIDDLEWARE_REPOSITORY}/actions/runs/${MIDDLEWARE_RELEASE_RUN_ID}/artifacts?per_page=100")"
          prefix="signed-middleware-release-${EXPECTED_SOURCE_SHA}-${MIDDLEWARE_RELEASE_RUN_ID}-"
          artifact_count="$(jq --arg prefix "$prefix" '[.artifacts[] | select(.expired == false and (.name | startswith($prefix)))] | length' <<<"$artifacts")"
          test "$artifact_count" = '1'
          artifact_id="$(jq -r --arg prefix "$prefix" '.artifacts[] | select(.expired == false and (.name | startswith($prefix))) | .id' <<<"$artifacts")"
          artifact_name="$(jq -r --arg prefix "$prefix" '.artifacts[] | select(.expired == false and (.name | startswith($prefix))) | .name' <<<"$artifacts")"
          artifact_digest="$(jq -r --arg prefix "$prefix" '.artifacts[] | select(.expired == false and (.name | startswith($prefix))) | .digest' <<<"$artifacts")"
          test "$artifact_digest" = "$EXPECTED_ARTIFACT_DIGEST"
          gh api "repos/${MIDDLEWARE_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/middleware-release.zip"
          unzip -q "$RUNNER_TEMP/middleware-release.zip" -d "$RUNNER_TEMP/middleware-release"
          mapfile -t evidence_files < <(find "$RUNNER_TEMP/middleware-release" -type f -printf '%P\n' | sort)
          expected_files=(
            middleware.grype.json
            middleware.spdx.json
            release-manifest.v1.json
            release-manifest.v1.sigstore.json
          )
          test "${#evidence_files[@]}" -eq "${#expected_files[@]}"
          for index in "${!expected_files[@]}"; do
            test "${evidence_files[$index]}" = "${expected_files[$index]}"
          done
          printf 'ARTIFACT_NAME=%s\n' "$artifact_name" >> "$GITHUB_ENV"
          printf 'ARTIFACT_DIGEST=%s\n' "$artifact_digest" >> "$GITHUB_ENV"
          printf 'RELEASE_DIRECTORY=%s\n' "$RUNNER_TEMP/middleware-release" >> "$GITHUB_ENV"

      - name: Install exact migration dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'

      - name: Install exact Cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Generate exact authority binding
        run: |
          set -Eeuo pipefail
          python3 tools/migrate_middleware_authority.py \
            --root . \
            --evidence "$RELEASE_DIRECTORY" \
            --artifact "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --run-id "$MIDDLEWARE_RELEASE_RUN_ID" \
            --cosign "$(command -v cosign)" \
            --output authority-migration-result.json
          rm -f .github/workflows/appolon-middleware-authority-migration.yml

      - name: Verify exact evidence and repository integrity
        run: |
          set -Eeuo pipefail
          git diff --check
          python3 -m compileall -q tools
          python3 tools/verify_middleware_release_evidence.py \
            --directory "$RELEASE_DIRECTORY" \
            --github-env "$RUNNER_TEMP/middleware-release-verified.env" \
            --tuple config/production-release-tuple.json \
            --run-id "$MIDDLEWARE_RELEASE_RUN_ID" \
            --artifact "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --cosign "$(command -v cosign)" \
            --derived-provenance-output "$RUNNER_TEMP/derived-provenance.json" \
            --derived-openvex-output "$RUNNER_TEMP/derived-openvex.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          value = json.loads(Path('authority-migration-result.json').read_text())
          assert value['source_sha'] == '1aa4d505846b7494aff94bec3d7ea68c895e2dd3'
          assert value['image_digest'] == 'sha256:cec8b5a1b0e713857be1dbc94b73780bf9ae1a200d0901f95cb62193b9c2f504'
          assert value['artifact_digest'] == 'sha256:cfd5ef83132da1683c0c053e7025739aa4c2747344aa7fc1feed48bf838a566a'
          assert value['migration_head'] == '0009_observability_incidents'
          assert value['builder'] == 'https://github.com/appolon1908-hue/Middleware-/.github/workflows/release.yml@refs/heads/main'
          for key, path in (
              ('provenance_sha256', Path(os.environ['RUNNER_TEMP']) / 'derived-provenance.json'),
              ('openvex_sha256', Path(os.environ['RUNNER_TEMP']) / 'derived-openvex.json'),
          ):
              assert hashlib.sha256(path.read_bytes()).hexdigest() == value[key]
          source_lock = Path('PRODUCTION-SOURCE-LOCK.yaml').read_text()
          assert 'status: FAIL' in source_lock
          assert 'deployment_authorized: false' in source_lock
          PY
          if python3 -c 'import pytest' 2>/dev/null; then
            focused=()
            for test_file in \
              tests/test_middleware_release_evidence.py \
              tests/test_verify_slsa_provenance_attestation.py \
              tests/test_build_release_bundle.py \
              tests/test_jetstream_worker_image.py; do
              test -f "$test_file" && focused+=("$test_file")
            done
            if ((${#focused[@]})); then python3 -m pytest -q "${focused[@]}"; fi
          fi

      - name: Commit generated authority binding to the review branch
        run: |
          set -Eeuo pipefail
          test -n "$(git status --porcelain)"
          git config user.name 'codestra-authority-bot'
          git config user.email 'appolon1908-hue@users.noreply.github.com'
          git add --all
          git commit -m 'release: bind exact Appolon Middleware authority [authority-generated]'
          git push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/release/appolon-middleware-authority-20260903
