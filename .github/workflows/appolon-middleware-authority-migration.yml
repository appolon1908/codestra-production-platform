name: Generate exact Appolon Middleware authority binding repair

on:
  push:
    branches:
      - fix/materialize-appolon-middleware-authority-20260903
    paths:
      - tools/migrate_middleware_authority.py
      - .github/workflows/appolon-middleware-authority-migration.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: appolon-middleware-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bind-exact-release:
    name: Bind exact signed Appolon Middleware release
    if: >-
      github.repository == 'appolon1908-hue/codestra-production-platform' &&
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[authority-generated]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIDDLEWARE_REPOSITORY: appolon1908-hue/Middleware-
      MIDDLEWARE_RELEASE_RUN_ID: '33767657962'
      MIDDLEWARE_RELEASE_RUN_ATTEMPT: '1'
      MIDDLEWARE_RELEASE_ARTIFACT_ID: '9898309168'
      MIDDLEWARE_RELEASE_ARTIFACT: signed-middleware-release-1aa4d505846b7494aff94bec3d7ea68c895e2dd3-33767657962-1
      MIDDLEWARE_ARTIFACT_ZIP_SHA256: cfd5ef83132da1683c0c053e7025739aa4c2747344aa7fc1feed48bf838a566a
      ARTIFACT_TOKEN: ${{ secrets.MIDDLEWARE_RELEASE_TOKEN || secrets.PRODUCTION_RELEASE_GITHUB_TOKEN || secrets.GHCR_TOKEN || github.token }}
      PUSH_TOKEN: ${{ secrets.PRODUCTION_RELEASE_GITHUB_TOKEN || secrets.GHCR_TOKEN || github.token }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the exact review head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove branch and source identity
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/materialize-appolon-middleware-authority-20260903'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test -n "$ARTIFACT_TOKEN"
          test -n "$PUSH_TOKEN"

      - name: Download and safely materialize the exact artifact
        env:
          GH_TOKEN: ${{ env.ARTIFACT_TOKEN }}
        run: |
          set -Eeuo pipefail
          metadata="$(gh api "repos/${MIDDLEWARE_REPOSITORY}/actions/artifacts/${MIDDLEWARE_RELEASE_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"$metadata")" = "$MIDDLEWARE_RELEASE_ARTIFACT_ID"
          test "$(jq -r '.name' <<<"$metadata")" = "$MIDDLEWARE_RELEASE_ARTIFACT"
          test "$(jq -r '.expired' <<<"$metadata")" = false
          test "$(jq -r '.workflow_run.id' <<<"$metadata")" = "$MIDDLEWARE_RELEASE_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$metadata")" = '1aa4d505846b7494aff94bec3d7ea68c895e2dd3'
          gh api "repos/${MIDDLEWARE_REPOSITORY}/actions/artifacts/${MIDDLEWARE_RELEASE_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/middleware-release.zip"
          echo "$MIDDLEWARE_ARTIFACT_ZIP_SHA256  $RUNNER_TEMP/middleware-release.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/middleware-release"
          python3 - "$RUNNER_TEMP/middleware-release.zip" "$RUNNER_TEMP/middleware-release" <<'PY'
          import sys, zipfile
          from pathlib import Path, PurePosixPath
          expected = {
              'release-manifest.v1.json',
              'release-manifest.v1.sigstore.json',
              'middleware.spdx.json',
              'middleware.grype.json',
          }
          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          with zipfile.ZipFile(archive) as source:
              names = set(source.namelist())
              assert names == expected, names ^ expected
              for name in sorted(names):
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  target = destination / name
                  target.write_bytes(source.read(name))
                  target.chmod(0o600)
          PY

      - name: Generate the deterministic review tree
        run: |
          set -Eeuo pipefail
          python3 tools/migrate_middleware_authority.py \
            --root . \
            --evidence "$RUNNER_TEMP/middleware-release" \
            --output "$RUNNER_TEMP/authority-result.json"
          cat "$RUNNER_TEMP/authority-result.json"
          test "$(jq -r '.status' "$RUNNER_TEMP/authority-result.json")" = GENERATED_REVIEW_ONLY
          test "$(jq -r '.production_deployment_authorized' "$RUNNER_TEMP/authority-result.json")" = false
          test "$(jq -r '.external_effects' "$RUNNER_TEMP/authority-result.json")" = DISABLED

      - name: Commit the verified review-only authority tree
        run: |
          set -Eeuo pipefail
          test -n "$(git status --porcelain)"
          test ! -e .github/workflows/appolon-middleware-authority-migration.yml
          test ! -e .github/workflows/appolon-middleware-authority-gate.yml
          test ! -e .github/workflows/appolon-middleware-authority-finalizer.yml
          test ! -e .github/workflows/appolon-middleware-post-merge-release.yml
          test ! -e tools/migrate_middleware_authority.py
          test ! -d .authority-payload
          ! find . -name '*.authority-new' -print -quit | grep -q .
          git config user.name 'codestra-authority-bot'
          git config user.email 'appolon1908-hue@users.noreply.github.com'
          git add --all
          git commit -m 'release: bind exact signed Appolon Middleware authority [authority-generated]'
          git push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/fix/materialize-appolon-middleware-authority-20260903

      - name: Validate the committed exact generated tree
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'pytest==8.4.2' 'PyYAML==6.0.2'
          test -z "$(git status --porcelain)"
          git diff --check HEAD^
          python3 -m py_compile \
            tools/*.py \
            tests/test_middleware_release_evidence.py \
            tests/test_release_bundle.py \
            tests/test_server_a_release_tuple.py \
            tests/test_jetstream_worker_image.py \
            tests/test_middleware_approved_release.py
          python3 tools/verify_middleware_release_evidence.py \
            --directory "$RUNNER_TEMP/middleware-release" \
            --tuple config/production-release-tuple.json \
            --github-env "$RUNNER_TEMP/middleware-release.env"
          python3 tools/validate_openai_provider_runtime_contract.py
          python3 -m pytest -q \
            tests/test_middleware_release_evidence.py \
            tests/test_release_bundle.py \
            tests/test_server_a_release_tuple.py \
            tests/test_jetstream_worker_image.py \
            tests/test_middleware_approved_release.py \
            tests/test_openai_provider_runtime_contract.py

      - name: Ready the protected review
        run: |
          set -Eeuo pipefail
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head fix/materialize-appolon-middleware-authority-20260903 \
            --base release/production-activation \
            --state open \
            --json number \
            --jq 'if length == 1 then .[0].number else error("authority PR missing or ambiguous") end')"
          gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY"
          gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --add-reviewer kazan555
          gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" --body 'The exact signed Appolon Middleware release is now bound to a deterministic review-only production authority tree. Full exact-head CI, independent approval, staging restore/rollback, and canary remain mandatory. No deployment or external effect is authorized.'
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --auto --squash
