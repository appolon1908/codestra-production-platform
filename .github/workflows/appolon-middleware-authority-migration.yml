name: Generate exact Appolon Middleware authority binding

on:
  push:
    branches:
      - release/appolon-middleware-authority-20260903
    paths:
      - tools/migrate_middleware_authority.py
      - docs/APPOLON_MIDDLEWARE_PRODUCTION_AUTHORITY_MIGRATION_20260903.md
      - .github/workflows/appolon-middleware-authority-migration.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: appolon-middleware-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bind-exact-release:
    name: Bind exact signed Middleware release
    if: >-
      github.actor == 'appolon1908-hue' &&
      !contains(github.event.head_commit.message, '[authority-generated]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIDDLEWARE_REPOSITORY: appolon1908-hue/Middleware-
      MIDDLEWARE_RELEASE_RUN_ID: '33767657962'
      EXPECTED_SOURCE_SHA: 1aa4d505846b7494aff94bec3d7ea68c895e2dd3
      EXPECTED_IMAGE_DIGEST: sha256:cec8b5a186866a4ce77a6079cb3ab6fdb2a3487003872e678b9caa90c1ae52e5
      ARTIFACT_TOKEN: ${{ secrets.MIDDLEWARE_RELEASE_TOKEN || secrets.PRODUCTION_RELEASE_GITHUB_TOKEN || secrets.GHCR_TOKEN || github.token }}
      PUSH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/appolon-middleware-authority-20260903
          fetch-depth: 0
          persist-credentials: false

      - name: Reject stale or unexpected branch source
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'appolon1908-hue/codestra-production-platform'
          test "$GITHUB_REF" = 'refs/heads/release/appolon-middleware-authority-20260903'
          test -z "$(git status --porcelain)"
          test -n "$ARTIFACT_TOKEN"

      - name: Download the single exact signed release artifact
        env:
          GH_TOKEN: ${{ env.ARTIFACT_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/middleware-release"
          artifacts="$(gh api "repos/${MIDDLEWARE_REPOSITORY}/actions/runs/${MIDDLEWARE_RELEASE_RUN_ID}/artifacts")"
          artifact_count="$(jq '[.artifacts[] | select(.expired == false)] | length' <<<"$artifacts")"
          test "$artifact_count" = '1'
          artifact_id="$(jq -r '.artifacts[] | select(.expired == false) | .id' <<<"$artifacts")"
          artifact_name="$(jq -r '.artifacts[] | select(.expired == false) | .name' <<<"$artifacts")"
          gh api "repos/${MIDDLEWARE_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/middleware-release.zip"
          unzip -q "$RUNNER_TEMP/middleware-release.zip" -d "$RUNNER_TEMP/middleware-release"
          release_env="$(find "$RUNNER_TEMP/middleware-release" -type f -name RELEASE.env -print -quit)"
          test -n "$release_env"
          release_dir="$(dirname "$release_env")"
          source_sha="$(sed -n 's/^SOURCE_SHA=//p' "$release_env")"
          image_digest="$(sed -n 's/^IMAGE_DIGEST=//p' "$release_env")"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          test "$image_digest" = "$EXPECTED_IMAGE_DIGEST"
          printf 'ARTIFACT_NAME=%s\n' "$artifact_name" >> "$GITHUB_ENV"
          printf 'RELEASE_DIRECTORY=%s\n' "$release_dir" >> "$GITHUB_ENV"

      - name: Install exact migration dependency
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'

      - name: Generate exact authority binding
        run: |
          set -Eeuo pipefail
          python3 tools/migrate_middleware_authority.py \
            --root . \
            --evidence "$RELEASE_DIRECTORY" \
            --artifact "$ARTIFACT_NAME" \
            --run-id "$MIDDLEWARE_RELEASE_RUN_ID" \
            --output authority-migration-result.json
          rm -f .github/workflows/appolon-middleware-authority-migration.yml

      - name: Verify exact evidence and repository integrity
        run: |
          set -Eeuo pipefail
          git diff --check
          python3 -m compileall -q tools
          python3 tools/verify_middleware_release_evidence.py \
            --directory "$RELEASE_DIRECTORY" \
            --github-env "$RUNNER_TEMP/middleware-release-verified.env" \
            --tuple config/production-release-tuple.json \
            --run-id "$MIDDLEWARE_RELEASE_RUN_ID" \
            --artifact "$ARTIFACT_NAME"
          python3 - <<'PY'
          import json
          value = json.load(open('authority-migration-result.json'))
          assert value['source_sha'] == '1aa4d505846b7494aff94bec3d7ea68c895e2dd3'
          assert value['image_digest'] == 'sha256:cec8b5a186866a4ce77a6079cb3ab6fdb2a3487003872e678b9caa90c1ae52e5'
          assert value['image_reference'].startswith('ghcr.io/appolon1908-hue/codestra-middleware@sha256:')
          assert value['builder'] == 'https://github.com/appolon1908-hue/Middleware-/.github/workflows/release.yml@refs/heads/main'
          PY
          if python3 -c 'import pytest' 2>/dev/null; then
            focused=()
            for test_file in \
              tests/test_middleware_release_evidence.py \
              tests/test_verify_slsa_provenance_attestation.py \
              tests/test_build_release_bundle.py \
              tests/test_jetstream_worker_image.py; do
              test -f "$test_file" && focused+=("$test_file")
            done
            if ((${#focused[@]})); then python3 -m pytest -q "${focused[@]}"; fi
          fi

      - name: Commit generated authority binding to the review branch
        run: |
          set -Eeuo pipefail
          test -n "$(git status --porcelain)"
          git config user.name 'codestra-authority-bot'
          git config user.email 'appolon1908-hue@users.noreply.github.com'
          git add --all
          git commit -m 'release: bind exact Appolon Middleware authority [authority-generated]'
          git push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/release/appolon-middleware-authority-20260903
