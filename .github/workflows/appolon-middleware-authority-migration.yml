name: Repair fail-closed Appolon authority validator

on:
  push:
    branches:
      - fix/materialize-appolon-middleware-authority-20260903
    paths:
      - .github/workflows/appolon-middleware-authority-migration.yml

permissions:
  contents: write

concurrency:
  group: appolon-authority-validator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-validator:
    if: >-
      github.repository == 'appolon1908-hue/codestra-production-platform' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUSH_TOKEN: ${{ secrets.PRODUCTION_RELEASE_GITHUB_TOKEN || secrets.GHCR_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the exact fail-closed image-reference repair
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/materialize-appolon-middleware-authority-20260903'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/validate_openai_provider_runtime_contract.py")
          text = path.read_text(encoding="utf-8")
          old_service = (
              '    require_equal(service.get("profiles"), [PROFILE], "service profile", errors)\n'
              '    require_equal(service.get("image"), image, "service image", errors)\n'
              '    require_equal(service.get("command"), ["python", "-m", "app.entrypoints.openai_worker"], "service command", errors)\n'
          )
          new_service = (
              '    require_equal(service.get("profiles"), [PROFILE], "service profile", errors)\n'
              '    service_image = service.get("image")\n'
              '    if isinstance(service_image, str) and ":latest" in service_image:\n'
              '        errors.append("mutable latest reference is forbidden")\n'
              '    require_equal(service_image, image, "service image", errors)\n'
              '    require_equal(service.get("command"), ["python", "-m", "app.entrypoints.openai_worker"], "service command", errors)\n'
          )
          old_tail = (
              '    if ":latest" in compose_text:\n'
              '        errors.append("mutable latest reference is forbidden")\n'
          )
          new_tail = (
              '    if ":latest" in compose_text and "mutable latest reference is forbidden" not in errors:\n'
              '        errors.append("mutable latest reference is forbidden")\n'
          )
          if text.count(old_service) != 1 or text.count(old_tail) != 1:
              raise SystemExit("validator source differs from reviewed generated tree")
          path.write_text(
              text.replace(old_service, new_service).replace(old_tail, new_tail),
              encoding="utf-8",
          )
          PY
          git diff --check

      - name: Run focused authority tests
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'pytest==8.4.2' 'PyYAML==6.0.2'
          python3 -m py_compile tools/validate_openai_provider_runtime_contract.py
          python3 tools/validate_openai_provider_runtime_contract.py
          python3 -m pytest -q \
            tests/test_middleware_release_evidence.py \
            tests/test_release_bundle.py \
            tests/test_server_a_release_tuple.py \
            tests/test_jetstream_worker_image.py \
            tests/test_middleware_approved_release.py \
            tests/test_openai_provider_runtime_contract.py

      - name: Push only the reviewed validator repair
        run: |
          set -Eeuo pipefail
          test -n "$PUSH_TOKEN"
          test "$(git status --short | awk '{print $2}')" = 'tools/validate_openai_provider_runtime_contract.py'
          git config user.name 'codestra-authority-bot'
          git config user.email 'appolon1908-hue@users.noreply.github.com'
          git add tools/validate_openai_provider_runtime_contract.py
          git commit -m 'fix(authority): reject mutable worker images directly [authority-validator-generated]'
          git push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/fix/materialize-appolon-middleware-authority-20260903
