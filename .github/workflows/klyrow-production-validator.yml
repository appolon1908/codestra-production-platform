name: Klyrow production validator

on:
  pull_request:
    branches: ["release/production-activation"]
    paths:
      - "operations/klyrow-production-validator/**"
      - "tests/test_klyrow_production_validator.py"
      - ".github/workflows/klyrow-production-validator.yml"
  push:
    branches: ["release/production-activation"]
    paths:
      - "operations/klyrow-production-validator/**"
      - "tests/test_klyrow_production_validator.py"
      - ".github/workflows/klyrow-production-validator.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: klyrow-production-validator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install fixed test tooling
        run: python -m pip install "pytest==8.3.5" "pip-audit==2.9.0"

      - name: Compile and validate static contracts
        run: |
          python -m py_compile operations/klyrow-production-validator/*.py \
            operations/klyrow-production-validator/klyrow-production-validator \
            operations/klyrow-production-validator/klyrow-production-validator-root \
            operations/klyrow-production-validator/klyrow-production-validator-actions
          python -m json.tool operations/klyrow-production-validator/command-contract.json >/dev/null
          sudo visudo -cf operations/klyrow-production-validator/klyrow-production-validator.sudoers

      - name: Run bounded-operator tests
        run: python -m pytest -q tests/test_klyrow_production_validator.py

      - name: Dependency vulnerability gate
        run: python -m pip_audit --disable-pip --no-deps -r operations/klyrow-production-validator/requirements.lock

      - name: Build deterministic candidate twice
        run: |
          python operations/klyrow-production-validator/build-operator-artifact.py \
            --source-sha "${GITHUB_SHA}" --workflow-run "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" --output dist-a
          python operations/klyrow-production-validator/build-operator-artifact.py \
            --source-sha "${GITHUB_SHA}" --workflow-run "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" --output dist-b
          cmp "dist-a/klyrow-production-validator-${GITHUB_SHA}.tar.gz" \
            "dist-b/klyrow-production-validator-${GITHUB_SHA}.tar.gz"
          cmp dist-a/SHA256SUMS dist-b/SHA256SUMS
          (cd dist-a && sha256sum --check --strict SHA256SUMS)
          test "$(python -c 'import json; print(json.load(open("dist-a/vulnerability-report.json"))["gate"])')" = PASS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: klyrow-validator-candidate-${{ github.sha }}
          path: dist-a/
          if-no-files-found: error
          retention-days: 30

  publish-protected-artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/production-activation'
    needs: validate-operator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Require protected exact SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Build protected artifact
        run: |
          python operations/klyrow-production-validator/build-operator-artifact.py \
            --source-sha "${GITHUB_SHA}" --workflow-run "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" --output dist
          (cd dist && sha256sum --check --strict SHA256SUMS)

      - name: Sign and verify checksum authority
        env:
          SIGNING_KEY: ${{ secrets.CODESTRA_RELEASE_SIGNING_KEY }}
          SIGNING_PUBLIC_KEY: ${{ secrets.CODESTRA_RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "${SIGNING_KEY}"
          test -n "${SIGNING_PUBLIC_KEY}"
          install -m 0700 -d "${RUNNER_TEMP}/kpv-signing"
          printf '%s\n' "${SIGNING_KEY}" > "${RUNNER_TEMP}/kpv-signing/key"
          chmod 0600 "${RUNNER_TEMP}/kpv-signing/key"
          printf 'codestra-release %s\n' "${SIGNING_PUBLIC_KEY}" > "${RUNNER_TEMP}/kpv-signing/allowed_signers"
          ssh-keygen -Y sign -q -f "${RUNNER_TEMP}/kpv-signing/key" \
            -n codestra-klyrow-validator dist/SHA256SUMS
          ssh-keygen -Y verify -q -f "${RUNNER_TEMP}/kpv-signing/allowed_signers" \
            -I codestra-release -n codestra-klyrow-validator \
            -s dist/SHA256SUMS.sig < dist/SHA256SUMS
          shred -u "${RUNNER_TEMP}/kpv-signing/key"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: klyrow-validator-protected-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "klyrow-validator-${GITHUB_SHA}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "Klyrow production validator ${GITHUB_SHA}" \
            --notes "Checksum- and signature-gated bounded operator. No deployment action."
