name: Exact protected release

on:
  push:
    branches: ["release/production-activation"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: protected-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/release/production-activation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Require protected exact SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Run complete source tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nats-server
          python -m pip install --upgrade "setuptools==83.0.0"
          python -m pip install pytest pytest-subtests PyYAML requests pip-audit "nats-py==2.15.0"
          python -m pip install -e 'vicidial[test]'
          python -m pytest -q
          python -m pip_audit --local

      - name: Build deterministic release, SBOM and provenance
        env:
          MIDDLEWARE_PROTECTED_SHA: ${{ vars.CODESTRA_MIDDLEWARE_PROTECTED_SHA }}
          MIDDLEWARE_IMAGE_DIGEST: ${{ vars.CODESTRA_MIDDLEWARE_PRODUCTION_IMAGE_DIGEST }}
          MIDDLEWARE_SIGNATURE_STATUS: ${{ vars.CODESTRA_MIDDLEWARE_PRODUCTION_SIGNATURE_STATUS }}
          MIDDLEWARE_PROVENANCE_STATUS: ${{ vars.CODESTRA_MIDDLEWARE_PRODUCTION_PROVENANCE_STATUS }}
          MIDDLEWARE_MIGRATION_REVISION: ${{ vars.CODESTRA_MIDDLEWARE_MIGRATION_REVISION }}
        run: |
          python tools/build_release_bundle.py \
            --root . \
            --output dist \
            --commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --middleware-sha "${MIDDLEWARE_PROTECTED_SHA}" \
            --middleware-image-digest "${MIDDLEWARE_IMAGE_DIGEST}" \
            --middleware-signature-status "${MIDDLEWARE_SIGNATURE_STATUS}" \
            --middleware-provenance-status "${MIDDLEWARE_PROVENANCE_STATUS}" \
            --migration-revision "${MIDDLEWARE_MIGRATION_REVISION}"
          (cd dist && sha256sum --check manifest.sha256)
          python - <<'PY'
          import json
          import os
          manifest = json.load(open("dist/deployment-manifest.json"))
          release = manifest["release_tuple"]
          assert release["middleware_protected_sha"] == os.environ["MIDDLEWARE_PROTECTED_SHA"]
          assert release["middleware_image_digest"] == os.environ["MIDDLEWARE_IMAGE_DIGEST"]
          assert release["middleware_signature_verification"] == "PASS"
          assert release["middleware_provenance_verification"] == "PASS"
          PY

      - name: Sign and independently verify release manifest
        env:
          SIGNING_KEY: ${{ secrets.CODESTRA_RELEASE_SIGNING_KEY }}
          SIGNING_PUBLIC_KEY: ${{ secrets.CODESTRA_RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "${SIGNING_KEY}"
          test -n "${SIGNING_PUBLIC_KEY}"
          install -m 0700 -d "${RUNNER_TEMP}/release-signing"
          printf '%s\n' "${SIGNING_KEY}" > "${RUNNER_TEMP}/release-signing/key"
          chmod 0600 "${RUNNER_TEMP}/release-signing/key"
          printf 'codestra-release %s\n' "${SIGNING_PUBLIC_KEY}" > "${RUNNER_TEMP}/release-signing/allowed_signers"
          ssh-keygen -Y sign -q -f "${RUNNER_TEMP}/release-signing/key" -n codestra-release dist/manifest.sha256
          ssh-keygen -Y verify -q \
            -f "${RUNNER_TEMP}/release-signing/allowed_signers" \
            -I codestra-release -n codestra-release \
            -s dist/manifest.sha256.sig < dist/manifest.sha256
          shred -u "${RUNNER_TEMP}/release-signing/key"

      - uses: actions/upload-artifact@v4
        with:
          name: protected-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "protected-${GITHUB_SHA}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "Protected release ${GITHUB_SHA}" \
            --notes "Exact protected release. Production features remain fail closed."
