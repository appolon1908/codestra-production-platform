name: Reference-only platform source gate

on:
  push:
    branches: ["release/production-activation"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm platform is reference only
        run: |
          set -euo pipefail
          grep -q 'historical deployment, runtime-reconciliation and rollback evidence' README.md
          grep -q 'appolon1908-hue/Caddy' README.md
          test -f operations/caddy/README.md
          echo 'REFERENCE_ONLY_REPOSITORY=PASS'
          echo 'CENTRAL_RELEASE_AUTHORITY=DISABLED'
          echo 'PROTECTED_RELEASE_PUBLICATION=DISABLED'
          echo 'Use each component principal repository for current releases.'
