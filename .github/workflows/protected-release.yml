name: Exact protected release

on:
  push:
    branches: ["release/production-activation"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: protected-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/release/production-activation'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Require protected exact SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"

      - name: Run complete source tests
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nats-server
          python -m pip install --upgrade "setuptools==83.0.0"
          python -m pip install pytest pytest-subtests PyYAML requests pip-audit \
            "bandit==1.9.4" "nats-py==2.15.0" "fastapi==0.141.1" \
            "PyJWT[crypto]==2.13.0" "psycopg[binary]==3.2.9" \
            "prometheus-client==0.22.1" "openapi-spec-validator==0.7.2"
          python -m pip install -e 'vicidial[test]'
          sudo --preserve-env=PATH "$(command -v python)" -m pytest -q
          python -m pytest -q \
            deploy/kong-production-standby/auth-middleware/test_token_validation.py
          python -m pip_audit --local

      - name: Load exact Middleware tuple
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' >> "${GITHUB_ENV}"
          import json
          from pathlib import Path
          value = json.loads(Path("config/production-release-tuple.json").read_text())
          mapping = {
              "MIDDLEWARE_REPOSITORY": value["middleware_repository"],
              "MIDDLEWARE_SOURCE_SHA": value["middleware_source_sha"],
              "MIDDLEWARE_SOURCE_TREE": value["middleware_source_tree"],
              "MIDDLEWARE_IMAGE_REPOSITORY": value["middleware_image_repository"],
              "MIDDLEWARE_IMAGE_DIGEST": value["middleware_digest"],
              "MIDDLEWARE_MIGRATION_HEAD": value["middleware_migration_head"],
              "MIDDLEWARE_RELEASE_RUN_ID": value["middleware_run_id"],
              "MIDDLEWARE_RELEASE_RUN_ATTEMPT": value["middleware_run_attempt"],
              "MIDDLEWARE_RELEASE_ARTIFACT_ID": value["middleware_artifact_id"],
              "MIDDLEWARE_RELEASE_ARTIFACT": value["middleware_artifact"],
              "MIDDLEWARE_ARTIFACT_ZIP_SHA256": value["middleware_artifact_zip_sha256"],
              "MIDDLEWARE_WORKFLOW_IDENTITY": value["middleware_workflow_identity"],
              "MIDDLEWARE_OIDC_ISSUER": value["middleware_oidc_issuer"],
          }
          for key, item in mapping.items():
              text = str(item)
              if "\n" in text or "\r" in text:
                  raise SystemExit(f"unsafe tuple value for {key}")
              print(f"{key}={text}")
          PY

      - name: Download and bind one exact Middleware evidence archive
        env:
          GH_TOKEN: ${{ secrets.CODESTRA_MIDDLEWARE_RELEASE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN}"
          [[ "${MIDDLEWARE_RELEASE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${MIDDLEWARE_RELEASE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${MIDDLEWARE_RELEASE_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          mkdir -p middleware-release
          gh api \
            "repos/${MIDDLEWARE_REPOSITORY}/actions/artifacts/${MIDDLEWARE_RELEASE_ARTIFACT_ID}" \
            > middleware-artifact-metadata.json
          jq -e \
            --arg name "${MIDDLEWARE_RELEASE_ARTIFACT}" \
            --argjson run "${MIDDLEWARE_RELEASE_RUN_ID}" \
            --argjson attempt "${MIDDLEWARE_RELEASE_RUN_ATTEMPT}" \
            '.name == $name and .expired == false and
             .workflow_run.id == $run and .workflow_run.run_attempt == $attempt' \
            middleware-artifact-metadata.json >/dev/null
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${MIDDLEWARE_REPOSITORY}/actions/artifacts/${MIDDLEWARE_RELEASE_ARTIFACT_ID}/zip" \
            > middleware-release.zip
          printf '%s  %s\n' \
            "${MIDDLEWARE_ARTIFACT_ZIP_SHA256}" middleware-release.zip \
            | sha256sum --check --strict
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          expected = {
              "release-manifest.v1.json",
              "release-manifest.v1.sigstore.json",
              "middleware.spdx.json",
              "middleware.grype.json",
          }
          archive = Path("middleware-release.zip")
          with ZipFile(archive) as source:
              files = [item for item in source.infolist() if not item.is_dir()]
              names = {item.filename for item in files}
              if names != expected:
                  raise SystemExit(f"artifact file set differs: {sorted(names)}")
              for item in files:
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive member: {item.filename}")
                  if item.file_size > 50 * 1024 * 1024:
                      raise SystemExit(f"artifact member too large: {item.filename}")
              source.extractall("middleware-release")
          PY
          python tools/verify_middleware_release_evidence.py \
            --directory middleware-release \
            --tuple config/production-release-tuple.json \
            --github-env middleware-release-verified.env
          cat middleware-release-verified.env >> "${GITHUB_ENV}"

      - name: Install checksum-verified Cosign
        env:
          COSIGN_VERSION: v3.1.2
          COSIGN_SHA256: f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            --output "${RUNNER_TEMP}/cosign"
          echo "${COSIGN_SHA256}  ${RUNNER_TEMP}/cosign" \
            | sha256sum --check --strict
          chmod 0700 "${RUNNER_TEMP}/cosign"

      - name: Verify image, provenance, SBOM, and release-manifest signatures
        env:
          GH_TOKEN: ${{ secrets.CODESTRA_MIDDLEWARE_RELEASE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          subject="${MIDDLEWARE_IMAGE_REPOSITORY}@${MIDDLEWARE_IMAGE_DIGEST}"
          printf '%s' "${GH_TOKEN}" \
            | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          "${RUNNER_TEMP}/cosign" verify \
            --certificate-identity "${MIDDLEWARE_WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer "${MIDDLEWARE_OIDC_ISSUER}" \
            "${subject}" > middleware-image-signature-verification.json
          "${RUNNER_TEMP}/cosign" verify-attestation \
            --type slsaprovenance1 \
            --certificate-identity "${MIDDLEWARE_WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer "${MIDDLEWARE_OIDC_ISSUER}" \
            "${subject}" > middleware-provenance-verification.json
          "${RUNNER_TEMP}/cosign" verify-attestation \
            --type spdxjson \
            --certificate-identity "${MIDDLEWARE_WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer "${MIDDLEWARE_OIDC_ISSUER}" \
            "${subject}" > middleware-sbom-verification.json
          "${RUNNER_TEMP}/cosign" verify-blob \
            --bundle middleware-release/release-manifest.v1.sigstore.json \
            --certificate-identity "${MIDDLEWARE_WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer "${MIDDLEWARE_OIDC_ISSUER}" \
            middleware-release/release-manifest.v1.json \
            > middleware-manifest-signature-verification.txt

      - name: Verify image labels and migration head
        run: |
          set -Eeuo pipefail
          subject="${MIDDLEWARE_IMAGE_REPOSITORY}@${MIDDLEWARE_IMAGE_DIGEST}"
          docker pull "${subject}"
          test "$(
            docker image inspect "${subject}" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          )" = "${MIDDLEWARE_PROTECTED_SHA}"
          test "$(
            docker image inspect "${subject}" \
              --format '{{index .Config.Labels "org.opencontainers.image.source"}}'
          )" = "https://github.com/${MIDDLEWARE_REPOSITORY}"
          mapfile -t migration_heads < <(
            docker run --rm --network none "${subject}" alembic heads |
              awk 'NF {print $1}'
          )
          test "${#migration_heads[@]}" -eq 1
          test "${migration_heads[0]}" = "${MIDDLEWARE_MIGRATION_HEAD}"
          printf 'MIDDLEWARE_MIGRATION_REVISION=%s\n' \
            "${migration_heads[0]}" >> "${GITHUB_ENV}"

      - name: Build deterministic release, SBOM, and provenance
        run: |
          set -Eeuo pipefail
          python tools/build_release_bundle.py \
            --root . \
            --output dist \
            --commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --middleware-image-signature-status PASS \
            --middleware-provenance-status PASS \
            --middleware-sbom-attestation-status PASS \
            --middleware-manifest-signature-status PASS \
            --migration-revision "${MIDDLEWARE_MIGRATION_REVISION}"
          install -m 0644 middleware-artifact-metadata.json \
            dist/middleware-artifact-metadata.json
          install -m 0644 middleware-image-signature-verification.json \
            dist/middleware-image-signature-verification.json
          install -m 0644 middleware-provenance-verification.json \
            dist/middleware-provenance-verification.json
          install -m 0644 middleware-sbom-verification.json \
            dist/middleware-sbom-verification.json
          install -m 0644 middleware-manifest-signature-verification.txt \
            dist/middleware-manifest-signature-verification.txt
          install -m 0644 middleware-release/release-manifest.v1.json \
            dist/middleware-release-manifest.v1.json
          install -m 0644 middleware-release/release-manifest.v1.sigstore.json \
            dist/middleware-release-manifest.v1.sigstore.json
          install -m 0644 middleware-release/middleware.spdx.json \
            dist/middleware.spdx.json
          install -m 0644 middleware-release/middleware.grype.json \
            dist/middleware.grype.json
          (cd dist && sha256sum \
            middleware-artifact-metadata.json \
            middleware-image-signature-verification.json \
            middleware-provenance-verification.json \
            middleware-sbom-verification.json \
            middleware-manifest-signature-verification.txt \
            middleware-release-manifest.v1.json \
            middleware-release-manifest.v1.sigstore.json \
            middleware.spdx.json middleware.grype.json \
            >> manifest.sha256)
          (cd dist && sha256sum --check --strict manifest.sha256)
          python3 - <<'PY'
          import json, os
          value = json.load(open("dist/deployment-manifest.json"))
          release = value["release_tuple"]
          assert release["middleware_protected_sha"] == os.environ["MIDDLEWARE_PROTECTED_SHA"]
          assert release["middleware_image_digest"] == os.environ["MIDDLEWARE_IMAGE_DIGEST"]
          for key in (
              "middleware_image_signature_verification",
              "middleware_provenance_verification",
              "middleware_sbom_attestation_verification",
              "middleware_manifest_signature_verification",
          ):
              assert release[key] == "PASS"
          assert release["production_deployment_authorized"] is False
          assert not any(value["required_flags"].values())
          PY

      - name: Sign and independently verify release manifest
        env:
          SIGNING_KEY: ${{ secrets.CODESTRA_RELEASE_SIGNING_KEY }}
          SIGNING_PUBLIC_KEY: ${{ secrets.CODESTRA_RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${SIGNING_KEY}"
          test -n "${SIGNING_PUBLIC_KEY}"
          install -m 0700 -d "${RUNNER_TEMP}/release-signing"
          printf '%s\n' "${SIGNING_KEY}" > "${RUNNER_TEMP}/release-signing/key"
          chmod 0600 "${RUNNER_TEMP}/release-signing/key"
          printf 'codestra-release %s\n' "${SIGNING_PUBLIC_KEY}" \
            > "${RUNNER_TEMP}/release-signing/allowed_signers"
          ssh-keygen -Y sign -q \
            -f "${RUNNER_TEMP}/release-signing/key" \
            -n codestra-release dist/manifest.sha256
          ssh-keygen -Y verify -q \
            -f "${RUNNER_TEMP}/release-signing/allowed_signers" \
            -I codestra-release -n codestra-release \
            -s dist/manifest.sha256.sig < dist/manifest.sha256
          shred -u "${RUNNER_TEMP}/release-signing/key"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "protected-${GITHUB_SHA}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "Protected release ${GITHUB_SHA}" \
            --notes "Exact protected release. Production deployment and external effects remain separately gated."
