name: Exact protected release

on:
  push:
    branches: ["release/production-activation"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: protected-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/release/production-activation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Require protected exact SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Run complete source tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nats-server
          python -m pip install --upgrade "setuptools==83.0.0"
          python -m pip install pytest pytest-subtests PyYAML requests pip-audit "nats-py==2.15.0"
          python -m pip install -e 'vicidial[test]'
          python -m pytest -q
          python -m pip_audit --local

      - name: Install checksum-verified Cosign
        env:
          COSIGN_VERSION: v3.1.2
          COSIGN_SHA256: f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            --output "${RUNNER_TEMP}/cosign"
          echo "${COSIGN_SHA256}  ${RUNNER_TEMP}/cosign" | sha256sum --check --strict
          chmod 0700 "${RUNNER_TEMP}/cosign"

      - name: Verify canonical middleware production evidence
        env:
          GH_TOKEN: ${{ secrets.CODESTRA_MIDDLEWARE_RELEASE_READ_TOKEN }}
          MIDDLEWARE_RELEASE_RUN_ID: ${{ vars.CODESTRA_MIDDLEWARE_PRODUCTION_RELEASE_RUN_ID }}
          MIDDLEWARE_RELEASE_ARTIFACT: ${{ vars.CODESTRA_MIDDLEWARE_PRODUCTION_RELEASE_ARTIFACT }}
        run: |
          test -n "${GH_TOKEN}"
          [[ "${MIDDLEWARE_RELEASE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          test -n "${MIDDLEWARE_RELEASE_ARTIFACT}"
          mkdir middleware-release
          gh run download "${MIDDLEWARE_RELEASE_RUN_ID}" \
            --repo Codestra-SRL/codestra-middleware \
            --name "${MIDDLEWARE_RELEASE_ARTIFACT}" \
            --dir middleware-release
          (cd middleware-release && sha256sum --check --strict SHA256SUMS)
          python tools/verify_middleware_release_evidence.py \
            --directory middleware-release --github-env middleware-release-verified.env
          cat middleware-release-verified.env >> "${GITHUB_ENV}"
          source middleware-release-verified.env
          subject="ghcr.io/codestra-srl/codestra-middleware@${MIDDLEWARE_IMAGE_DIGEST}"
          identity="https://github.com/Codestra-SRL/codestra-middleware/.github/workflows/exact-main-production-release.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          "${RUNNER_TEMP}/cosign" verify \
            --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" \
            "${subject}" > middleware-signature-verification.json
          "${RUNNER_TEMP}/cosign" verify-attestation --type slsaprovenance1 \
            --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" \
            "${subject}" > middleware-provenance-verification.json
          docker pull "${subject}"
          test "$(docker image inspect "${subject}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${MIDDLEWARE_PROTECTED_SHA}"
          migration_revision="$(docker run --rm --network none "${subject}" alembic heads | awk 'NR == 1 {print $1}')"
          test -n "${migration_revision}"
          printf 'MIDDLEWARE_MIGRATION_REVISION=%s\n' "${migration_revision}" >> "${GITHUB_ENV}"

      - name: Build deterministic release, SBOM and provenance
        run: |
          python tools/build_release_bundle.py \
            --root . \
            --output dist \
            --commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --middleware-sha "${MIDDLEWARE_PROTECTED_SHA}" \
            --middleware-image-digest "${MIDDLEWARE_IMAGE_DIGEST}" \
            --middleware-signature-status "PASS" \
            --middleware-provenance-status "PASS" \
            --migration-revision "${MIDDLEWARE_MIGRATION_REVISION}"
          (cd dist && sha256sum --check manifest.sha256)
          python - <<'PY'
          import json
          import os
          manifest = json.load(open("dist/deployment-manifest.json"))
          release = manifest["release_tuple"]
          assert release["middleware_protected_sha"] == os.environ["MIDDLEWARE_PROTECTED_SHA"]
          assert release["middleware_image_digest"] == os.environ["MIDDLEWARE_IMAGE_DIGEST"]
          assert release["middleware_signature_verification"] == "PASS"
          assert release["middleware_provenance_verification"] == "PASS"
          PY

      - name: Sign and independently verify release manifest
        env:
          SIGNING_KEY: ${{ secrets.CODESTRA_RELEASE_SIGNING_KEY }}
          SIGNING_PUBLIC_KEY: ${{ secrets.CODESTRA_RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "${SIGNING_KEY}"
          test -n "${SIGNING_PUBLIC_KEY}"
          install -m 0700 -d "${RUNNER_TEMP}/release-signing"
          printf '%s\n' "${SIGNING_KEY}" > "${RUNNER_TEMP}/release-signing/key"
          chmod 0600 "${RUNNER_TEMP}/release-signing/key"
          printf 'codestra-release %s\n' "${SIGNING_PUBLIC_KEY}" > "${RUNNER_TEMP}/release-signing/allowed_signers"
          ssh-keygen -Y sign -q -f "${RUNNER_TEMP}/release-signing/key" -n codestra-release dist/manifest.sha256
          ssh-keygen -Y verify -q \
            -f "${RUNNER_TEMP}/release-signing/allowed_signers" \
            -I codestra-release -n codestra-release \
            -s dist/manifest.sha256.sig < dist/manifest.sha256
          shred -u "${RUNNER_TEMP}/release-signing/key"

      - uses: actions/upload-artifact@v4
        with:
          name: protected-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "protected-${GITHUB_SHA}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "Protected release ${GITHUB_SHA}" \
            --notes "Exact protected release. Production features remain fail closed."
