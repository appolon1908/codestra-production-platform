name: Corporate delivery transaction contracts
on:
  pull_request:
    paths:
      - 'control_plane_service/**'
      - 'migrations/control_plane/**'
      - 'tests/**'
      - 'scripts/verify_corporate_delivery_postgres.py'
      - '.github/workflows/corporate-delivery-contract.yml'
permissions:
  contents: read
jobs:
  transaction-contracts:
    name: corporate-delivery-${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: [head, merge]
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: corporate_delivery_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d corporate_delivery_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      EXPECTED_SHA: ${{ matrix.source == 'head' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install the repository source-test versions
        run: python -m pip install pytest==9.0.2 PyYAML==6.0.3 'psycopg[binary]==3.2.9' 'PyJWT[crypto]==2.13.0' nats-py==2.15.0 websockets==17.0.1
      - name: Exercise signatures, TLS, receipts and retry contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m pytest -q tests/test_vicidial_event_ingress.py tests/test_automation_attempts.py tests/test_automation_gateway.py tests/test_calling_event_delivery.py tests/test_realtime_gateway.py
      - name: Exercise limited-role PostgreSQL transactions and migration backfill
        env:
          CORPORATE_DISPOSABLE_DATABASE: 'YES'
          CONTROL_PLANE_DATABASE_URL: postgresql://ci:disposable-ci-only@127.0.0.1:5432/corporate_delivery_ci
          PYTHONPATH: .
        run: python scripts/verify_corporate_delivery_postgres.py
      - name: Reject tracked-source mutation
        run: git diff --exit-code && git diff --cached --exit-code
