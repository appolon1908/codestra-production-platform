name: Odoo CRM Call Follow-up Analytics

on:
  pull_request:
    paths:
      - "odoo_addons/codestra_crm_call_followup_analytics/**"
      - "scripts/validate_odoo_crm_call_followup_analytics.py"
      - "scripts/test_odoo_crm_call_followup_analytics_disposable.sh"
      - ".github/workflows/odoo-crm-call-followup-analytics.yml"
  push:
    branches:
      - "feature/odoo19-crm-call-followup-analytics-v2"
    paths:
      - "odoo_addons/codestra_crm_call_followup_analytics/**"
      - "scripts/validate_odoo_crm_call_followup_analytics.py"
      - "scripts/test_odoo_crm_call_followup_analytics_disposable.sh"
      - ".github/workflows/odoo-crm-call-followup-analytics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odoo-crm-followup-analytics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject whitespace and conflict markers
        run: |
          git diff --check
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.md'
      - name: Compile Python
        run: python -m compileall -q odoo_addons/codestra_crm_call_followup_analytics scripts/validate_odoo_crm_call_followup_analytics.py
      - name: Validate analytics invariants
        run: python scripts/validate_odoo_crm_call_followup_analytics.py
      - name: Install, test, upgrade, and uninstall in disposable Odoo 19
        run: bash scripts/test_odoo_crm_call_followup_analytics_disposable.sh
