name: WebSocket 6101 immutable release

on:
  pull_request:
    paths:
      - "websocket_gateway/**"
      - "agent_desktop/**"
      - "webphone_middleware/**"
      - ".github/workflows/websocket-6101-release.yml"
  workflow_dispatch:
    inputs:
      release_version:
        description: Immutable release version, for example websocket-6101-v1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: websocket-6101-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SYFT_IMAGE: anchore/syft:v1.50.0@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026
  TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f

jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent_desktop/package-lock.json
      - name: Verify exact source and deterministic locks
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -s websocket_gateway/requirements.lock
          test -s agent_desktop/package-lock.json
          test -s webphone_middleware/requirements.lock
          git diff --check
          python -m compileall -q websocket_gateway
          python -m pytest -q websocket_gateway/test_migrations.py
      - name: Test Agent Desktop
        working-directory: agent_desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - name: Test webphone issuer contract
        working-directory: webphone_middleware
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements-test.lock
          python -m pytest -q tests/test_webphone.py
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" dir --no-banner --redact --exit-code 1 .
      - name: Dependency and source vulnerability scan
        run: |
          docker run --rm -v "${PWD}:/src:ro" "${TRIVY_IMAGE}" fs \
            --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 /src

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: source-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: codestra-websocket-gateway
            context: websocket_gateway
            target: ""
          - name: codestra-agent-desktop
            context: agent_desktop
            target: ""
          - name: codestra-webphone-middleware
            context: webphone_middleware
            target: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define and protect immutable identity
        id: identity
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          [[ "${RELEASE_VERSION}" =~ ^[a-z0-9][a-z0-9._-]{2,63}$ ]]
          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${{ matrix.name }}"
          if docker buildx imagetools inspect "${image}:${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release version already exists and cannot be overwritten."
            exit 1
          fi
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Build and publish exact source with OCI provenance
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          VERSION: ${{ steps.identity.outputs.version }}
          CONTEXT: ${{ matrix.context }}
          TARGET: ${{ matrix.target }}
        run: |
          target_args=()
          if test -n "${TARGET}"; then target_args=(--target "${TARGET}"); fi
          docker buildx build "${CONTEXT}" \
            "${target_args[@]}" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --build-arg "BUILD_REVISION=${GITHUB_SHA}" \
            --build-arg "BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:${VERSION}" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file build-metadata.json \
            --push
          digest="$(jq -r '."containerimage.digest"' build-metadata.json)"
          test "${digest#sha256:}" != "${digest}"
          printf 'IMAGE=%s\nDIGEST=%s\nSOURCE_SHA=%s\n' "${IMAGE}" "${digest}" "${GITHUB_SHA}" | tee RELEASE.env
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
        id: build
      - name: Generate bound SBOM and checksums
        env:
          SUBJECT: ${{ steps.identity.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "${SYFT_IMAGE}" "${SUBJECT}" -o cyclonedx-json > sbom.cdx.json
          git archive --format=tar --output source.tar HEAD
          sha256sum source.tar > checksums.sha256
          sha256sum sbom.cdx.json build-metadata.json RELEASE.env >> checksums.sha256
          sha256sum --check checksums.sha256 --ignore-missing
      - name: Reject HIGH and CRITICAL image vulnerabilities
        env:
          SUBJECT: ${{ steps.identity.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "${TRIVY_IMAGE}" image \
            --severity HIGH,CRITICAL --exit-code 1 --format json \
            --output /tmp/trivy.json "${SUBJECT}"
          docker run --rm "${TRIVY_IMAGE}" image \
            --severity HIGH,CRITICAL --exit-code 1 "${SUBJECT}"
      - name: Install checksum-verified Cosign
        env:
          COSIGN_VERSION: v3.1.2
          COSIGN_SHA256: f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            --output "${RUNNER_TEMP}/cosign"
          echo "${COSIGN_SHA256}  ${RUNNER_TEMP}/cosign" | sha256sum --check --strict
          chmod 0700 "${RUNNER_TEMP}/cosign"
      - name: Sign digest and attest SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
          SUBJECT: ${{ steps.identity.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          "${RUNNER_TEMP}/cosign" sign --yes "${SUBJECT}"
          "${RUNNER_TEMP}/cosign" attest --yes --type cyclonedx \
            --predicate sbom.cdx.json "${SUBJECT}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/websocket-6101-release.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          "${RUNNER_TEMP}/cosign" verify --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}" "${SUBJECT}" > signature-verification.json
          "${RUNNER_TEMP}/cosign" verify-attestation --type cyclonedx \
            --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" \
            "${SUBJECT}" > sbom-attestation-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: websocket-6101-${{ matrix.name }}-${{ github.sha }}
          path: |
            RELEASE.env
            source.tar
            checksums.sha256
            sbom.cdx.json
            build-metadata.json
            signature-verification.json
            sbom-attestation-verification.json
          if-no-files-found: error
          retention-days: 90
