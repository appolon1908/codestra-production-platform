name: Platform source validation

# Mandatory CI must run even for README-only or unclassified file changes.
on:
  pull_request:
  push:
    branches:
      - release/production-activation
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact current protected-branch head SHA to validate
        required: true
        type: string
      comparison_base_sha:
        description: Optional reviewed ancestor SHA; blank/zero uses the first parent
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact validation target with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact validation target and comparison range
        id: source-context
        env:
          PROTECTED_BRANCH: release/production-activation
        run: |
          set -euo pipefail
          python tools/resolve_platform_source_gate.py \
            --event-name "${GITHUB_EVENT_NAME}" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --github-sha "${GITHUB_SHA}" \
            --github-ref "${GITHUB_REF}" \
            --checked-out-sha "$(git rev-parse HEAD)" \
            --protected-branch "${PROTECTED_BRANCH}" \
            --repository . \
            --output "${RUNNER_TEMP}/source-validation-context.json" \
            --github-output "${GITHUB_OUTPUT}"
          target="$(jq -r .target_sha "${RUNNER_TEMP}/source-validation-context.json")"
          mode="$(jq -r .comparison_mode "${RUNNER_TEMP}/source-validation-context.json")"
          {
            echo "### Platform source validation"
            echo "- Event: ${GITHUB_EVENT_NAME}"
            echo "- Target: ${target}"
            echo "- Comparison: ${mode}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Verify intended protected branch head
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.source-context.outputs.target_sha }}
        run: |
          set -euo pipefail
          observed="$(gh api \
            "repos/${GITHUB_REPOSITORY}/branches/release%2Fproduction-activation" \
            --jq .commit.sha)"
          test "${observed}" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"

      - name: Set up repository-supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install source-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nats-server
          python -m pip install pytest pytest-subtests PyYAML requests "bandit==1.9.4" "nats-py==2.15.0" \
            "fastapi==0.141.1" "PyJWT[crypto]==2.13.0" "psycopg[binary]==3.2.9" "prometheus-client==0.22.1" "websockets==17.0.1" \
            "jsonschema" "openapi-spec-validator==0.7.2"

      - name: Verify recovered source evidence hashes
        run: |
          echo \
            "03c17d910768d3ccb11d421953e9fc916f510c6d0097b8b47418f978c4ce1806  scripts/canonical_event_client.py.reference" |
            sha256sum --check -
          echo \
            "f8a329b1808331c53ca6d5e02c9c002de3bd10437b3061a26d030e594a199b9c  scripts/vicidial_sync.py.candidate" |
            sha256sum --check -

      - name: Verify canonical calling contract in required validation
        shell: bash
        run: |
          actual="$(scripts/telephony-contract-digest.sh)"
          expected="$(jq -r .canonical_digest evidence/calling/CALLING-CONTRACT-DIGESTS.json)"
          test "$actual" = "$expected"
          python -m pytest -q tests/test_calling_contract_digest.py tests/test_canonical_caddy_api_contract.py tests/test_calling_contract_remediation.py

      - name: Run complete clean-checkout platform suite
        run: |
          set -o pipefail
          sudo --preserve-env=PATH \
            "$(command -v python)" -m pytest -q |
            tee "${RUNNER_TEMP}/pytest-output.txt"
          python -m pytest -q \
            deploy/kong-production-standby/auth-middleware/test_token_validation.py
          python - "${RUNNER_TEMP}/pytest-output.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          output = Path(sys.argv[1]).read_text()
          passed = sum(int(value) for value in re.findall(r"(\d+) passed", output))
          subtests = sum(
              int(value) for value in re.findall(r"(\d+) subtests passed", output)
          )
          if passed < 97 or subtests < 9:
              raise SystemExit(
                  f"insufficient coverage: passed={passed}, subtests={subtests}"
              )
          print(f"minimum test gate satisfied: passed={passed}, subtests={subtests}")
          PY

      - name: Compile all tracked Python involved in the suite
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          paths = {
              Path(value)
              for value in subprocess.check_output(
                  ["git", "ls-files", "*.py"], text=True
              ).splitlines()
          }
          paths.update(
              {
                  Path("scripts/canonical_event_client.py.reference"),
                  Path("scripts/vicidial_sync.py.candidate"),
              }
          )
          for path in sorted(paths):
              compile(path.read_text(), str(path), "exec", dont_inherit=True)
          print(f"compiled {len(paths)} tracked Python sources")
          PY

      - name: Validate control-plane contracts and deployment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from openapi_spec_validator import validate_spec
          import yaml

          schema = json.loads(Path("schemas/integration-event-envelope-v1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          platform_release_schema = json.loads(
              Path("release/platform-release-manifest.v1.schema.json").read_text()
          )
          Draft202012Validator.check_schema(platform_release_schema)
          manifest = json.loads(Path("n8n/control-plane/workflow-manifest.json").read_text())
          assert manifest["defaults"]["active"] is False
          names = [item["name"] for item in manifest["workflows"]]
          assert len(names) == len(set(names)) and len(names) >= 4
          validate_spec(yaml.safe_load(Path("docs/openapi/control-plane-v1.yaml").read_text()))
          PY
          python scripts/validate_platform_authority.py
          CONTROL_PLANE_ENV_FILE="$PWD/config/control-plane.env.example" \
            docker compose -f deploy/control-plane/compose.yaml config --quiet
          docker build -f deploy/control-plane/Dockerfile -t codestra-control-plane:ci .

      - name: Enforce integration constitution
        run: |
          python tools/check_integration_architecture.py \
            --evidence "${RUNNER_TEMP}/integration-architecture.json"

      - name: Validate Git whitespace
        env:
          DIFF_SPEC: ${{ steps.source-context.outputs.diff_spec }}
        run: git diff --check "${DIFF_SPEC}"

      - name: Reject forbidden artifacts and customer-data paths
        env:
          DIFF_SPEC: ${{ steps.source-context.outputs.diff_spec }}
        run: |
          changed="$(git diff --name-only "${DIFF_SPEC}")"
          if grep -E \
            '(^|/)(secrets?|private[-_]?keys?|recordings?|backups?|runtime|spool|logs?|dumps?|customer[-_]?data|call[-_]?recordings?)(/|$)|[.](pem|key|p12|pfx|dump|backup|sqlite3|db|wav|gsm|mp3|ogg|log)$' \
            <<<"${changed}"
          then
            echo "Forbidden secret, runtime, backup, recording, or customer-data artifact."
            exit 1
          fi

      - name: Confirm production feature defaults remain fail closed
        env:
          DIFF_SPEC: ${{ steps.source-context.outputs.diff_spec }}
        run: |
          if git diff --unified=0 "${DIFF_SPEC}" |
            grep -E '^\+[^+].*(ENABLE_[A-Z0-9_]+[=:][[:space:]]*(true|True|TRUE)|ENABLE_[A-Z0-9_]+["'\'']?[[:space:]]*:[[:space:]]*true)'
          then
            echo "A production-capability feature default was changed to true."
            exit 1
          fi

      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/gitleaks-bin"

      - name: Gitleaks candidate tree
        run: |
          report="${RUNNER_TEMP}/gitleaks-candidate.json"
          set +e
          "${RUNNER_TEMP}/gitleaks-bin" dir --no-banner --redact --exit-code 1 \
            --report-format json --report-path "${report}" .
          status=$?
          set -e
          if [[ -s "${report}" ]]; then
            python - "${report}" <<'PY'
          import json
          import sys
          from pathlib import Path

          findings = json.loads(Path(sys.argv[1]).read_text())
          for finding in findings:
              rule = finding.get("RuleID", "unknown")
              path = finding.get("File", "unknown")
              line = finding.get("StartLine", "unknown")
              print(f"Gitleaks finding: rule={rule} file={path}:{line}")
          PY
          fi
          exit "${status}"

      - name: Gitleaks resolved commit range
        env:
          GITLEAKS_LOG_OPTS: ${{ steps.source-context.outputs.gitleaks_log_opts }}
        run: |
          "${RUNNER_TEMP}/gitleaks-bin" git --no-banner --redact --exit-code 1 \
            --log-opts="${GITLEAKS_LOG_OPTS}"
