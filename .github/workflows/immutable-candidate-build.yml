name: immutable-candidate-build

on:
  pull_request:
    paths:
      - control_plane_service/**
      - email_reseller_service/**
      - mail_platform/**
      - reseller_portal/**
      - deploy/control-plane/**
      - deploy/email-reseller/**
      - deploy/mail-platform/**
      - deploy/reseller-portal/**
      - .github/workflows/immutable-candidate-build.yml
  push:
    branches: [release/production-activation]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: integration-control-plane
            dockerfile: deploy/control-plane/Dockerfile
          - component: email-reseller
            dockerfile: deploy/email-reseller/Dockerfile
          - component: mail-api
            dockerfile: deploy/mail-platform/Dockerfile.api
          - component: reseller-portal
            dockerfile: deploy/reseller-portal/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build local security candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: local/${{ matrix.component }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ github.sha }}
            BUILD_CREATED=${{ github.event.head_commit.timestamp }}
          provenance: false
          sbom: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/${{ matrix.component }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ github.sha }}
            BUILD_CREATED=${{ github.event.head_commit.timestamp }}
          provenance: mode=max
          sbom: true
      - name: Verify immutable candidate evidence
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .SBOM }}' > sbom.json
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .Provenance }}' > provenance.json
          jq -e 'type == "object" and length > 0' sbom.json >/dev/null
          jq -e 'type == "object" and length > 0' provenance.json >/dev/null
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{ json .Config.Labels }}' > labels.json
          jq -e --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --arg sha "${GITHUB_SHA}" '
            .["org.opencontainers.image.source"] == $source and
            .["org.opencontainers.image.revision"] == $sha and
            .["org.opencontainers.image.version"] == $sha
          ' labels.json >/dev/null
          printf '%s\n' "SOURCE_SHA=${GITHUB_SHA}" "IMAGE_DIGEST=${{ steps.build.outputs.digest }}" \
            "SBOM=PASS" "PROVENANCE=PASS" "VULNERABILITY_GATE=PASS" \
            "OCI_SOURCE=PASS" "OCI_REVISION=PASS" "OCI_VERSION=PASS" \
            > candidate-${{ matrix.component }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push'
        with:
          name: candidate-${{ matrix.component }}
          path: candidate-${{ matrix.component }}.txt
