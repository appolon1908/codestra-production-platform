name: email-reseller-authority
on:
  pull_request:
    paths: [email_reseller_service/**, deploy/email-reseller/**, tests/test_email_reseller_service.py, .github/workflows/email-reseller-authority.yml]
permissions: {contents: read, pull-requests: read}
jobs:
  validate-email-reseller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m compileall -q email_reseller_service
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/email-reseller/Dockerfile
          load: true
          tags: codestra/email-reseller:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: 'codestra/email-reseller:${{ github.sha }}', severity: 'CRITICAL,HIGH', ignore-unfixed: true, exit-code: '1'}
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/authority-gitleaks"

      - name: Scan complete source tree for secrets
        run: |
          scan_root="${RUNNER_TEMP}/tracked-source"
          mkdir -p "${scan_root}"
          git archive HEAD | tar -x -C "${scan_root}"
          "${RUNNER_TEMP}/authority-gitleaks" dir --no-banner --redact --exit-code 1 "${scan_root}"
