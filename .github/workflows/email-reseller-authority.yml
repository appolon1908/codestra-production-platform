name: email-reseller-authority
on:
  pull_request:
    paths: [email_reseller_service/**, deploy/email-reseller/**, tests/test_email_reseller_service.py, .github/workflows/email-reseller-authority.yml]
permissions: {contents: read, pull-requests: read}
jobs:
  validate-email-reseller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m compileall -q email_reseller_service
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/email-reseller/Dockerfile
          load: true
          tags: codestra/email-reseller:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: 'codestra/email-reseller:${{ github.sha }}', severity: 'CRITICAL,HIGH', ignore-unfixed: true, exit-code: '1'}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}

