name: Production merge gate

# Every other pull_request workflow in this repository is path-filtered, so no
# single check runs on every PR and therefore none can be marked required: a
# required context that does not run sits at "Expected" and blocks the PR
# forever. This workflow is deliberately unfiltered so it runs on every PR and
# can serve as the one required status check.
#
# It is not a rubber stamp. It waits for every other check run and commit
# status on the PR head to finish, then fails if any of them failed. That makes
# "no failing check may merge" enforceable even though which checks run varies
# per PR.

on:
  pull_request:

permissions:
  checks: read
  statuses: read
  contents: read

concurrency:
  group: production-merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production-gate:
    name: production-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require all other checks on this commit to succeed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELF_NAME: production-gate
          # Give sibling workflows time to register their check runs before we
          # conclude that a PR has none. Without this the gate can pass while
          # another workflow is still being queued.
          GRACE_SECONDS: '60'
          POLL_SECONDS: '20'
          MAX_WAIT_SECONDS: '1800'
        run: |
          set -euo pipefail

          echo "Gating $REPO @ $HEAD_SHA"
          echo "Grace period: ${GRACE_SECONDS}s"
          sleep "$GRACE_SECONDS"

          deadline=$(( SECONDS + MAX_WAIT_SECONDS ))

          while :; do
            # Check runs (GitHub Actions jobs and most Apps), excluding ourselves.
            # filter=latest keeps only the newest run per check name, so a
            # failure that was later re-run and fixed does not wedge the gate.
            checks=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100&filter=latest" \
              --paginate \
              --jq ".check_runs[]
                    | select(.name != \"$SELF_NAME\")
                    | \"\(.name)\t\(.status)\t\(.conclusion // \"-\")\"")

            # Legacy commit statuses (non-Checks-API integrations).
            statuses=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
              --jq '.statuses[] | "\(.context)\tcompleted\t\(.state)"' 2>/dev/null || true)

            all=$(printf '%s\n%s\n' "$checks" "$statuses" | sed '/^$/d')

            if [ -z "$all" ]; then
              echo "No other checks reported on this commit."
              echo "Nothing to aggregate; the review requirement is the only gate."
              exit 0
            fi

            pending=$(printf '%s\n' "$all" \
              | awk -F'\t' '$2 != "completed" { print $1" ("$2")" }')

            # skipped / neutral are treated as passing: a path-filtered job that
            # correctly did not apply must not block the merge.
            failed=$(printf '%s\n' "$all" \
              | awk -F'\t' '$2 == "completed" &&
                            $3 != "success" &&
                            $3 != "skipped" &&
                            $3 != "neutral" { print $1" -> "$3 }')

            if [ -n "$pending" ]; then
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::Timed out after ${MAX_WAIT_SECONDS}s waiting for:"
                printf '  %s\n' "$pending"
                exit 1
              fi
              echo "Waiting on:"
              printf '  %s\n' "$pending"
              sleep "$POLL_SECONDS"
              continue
            fi

            if [ -n "$failed" ]; then
              echo "::error::Failing checks on this commit:"
              printf '  %s\n' "$failed"
              exit 1
            fi

            echo "All checks on this commit passed:"
            printf '%s\n' "$all" | awk -F'\t' '{ print "  "$1" -> "$3 }'
            exit 0
          done
