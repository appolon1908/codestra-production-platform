name: Production merge gate

# No review-count dependency: mandatory CI absence and skipped tests cannot pass.
on:
  pull_request:

permissions:
  actions: read
  checks: read
  statuses: read
  contents: read
  pull-requests: read

concurrency:
  group: production-merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production-gate:
    name: production-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the candidate without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require exact-candidate and current-base CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 tools/ci_merge_gate.py --repo "$REPO" --pr "$PR_NUMBER" \
            --head "$HEAD_SHA" --base "$BASE_SHA"

  checks-only-policy:
    # New context prevents older queued PRs using the permissive gate from merging
    # when an owner installs the zero-review policy. They must integrate this change.
    name: checks-only-policy
    needs: production-gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the hardened gate to have actually succeeded
        env:
          GATE_RESULT: ${{ needs.production-gate.result }}
        run: |
          test "$GATE_RESULT" = success
          echo CHECKS_ONLY_POLICY_V1=PASS
