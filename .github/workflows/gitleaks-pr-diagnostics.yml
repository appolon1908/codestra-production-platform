name: Gitleaks PR diagnostics

# Mandatory CI must run even for README-only or unclassified file changes.
on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete PR history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/gitleaks-bin"

      - name: Scan PR commit range and report metadata only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks-pr-range.json"
          set +e
          "${RUNNER_TEMP}/gitleaks-bin" git --no-banner --redact --exit-code 1 \
            --report-format json --report-path "${report}" \
            --log-opts="${BASE_SHA}..HEAD"
          status=$?
          set -e
          if [[ -s "${report}" ]]; then
            python - "${report}" <<'PY'
          import json
          import sys
          from pathlib import Path

          findings = json.loads(Path(sys.argv[1]).read_text())
          for finding in findings:
              print(
                  "Gitleaks finding: "
                  f"rule={finding.get('RuleID', 'unknown')} "
                  f"file={finding.get('File', 'unknown')}:"
                  f"{finding.get('StartLine', 'unknown')} "
                  f"commit={finding.get('Commit', 'unknown')}"
              )
          print(f"Gitleaks finding count: {len(findings)}")
          PY
          fi
          exit "${status}"
