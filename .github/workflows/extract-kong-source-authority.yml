name: Extract Kong source ownership from platform

on:
  push:
    branches:
      - refactor/extract-kong-source-authority-20260826
    paths:
      - .github/workflows/extract-kong-source-authority.yml

permissions:
  contents: write

concurrency:
  group: extract-kong-source-authority
  cancel-in-progress: false

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply repository ownership boundary
        run: python3 tools/apply_kong_repository_extraction.py

      - name: Install platform test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nats-server
          python3 -m pip install --disable-pip-version-check \
            pytest pytest-subtests PyYAML requests nats-py==2.15.0 \
            fastapi==0.141.1 'PyJWT[crypto]==2.13.0' 'psycopg[binary]==3.2.9'

      - name: Validate extracted boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_kong_source_lock.py --online
          python3 -m compileall -q tools tests
          python3 -m pytest -q
          python3 tools/check_integration_architecture.py \
            --evidence "${RUNNER_TEMP}/integration-architecture.json"
          git diff --check

          if git grep -nE \
            'deploy/kong(/|-production-standby)|operations/kong-database|scripts/(apply_kong_standby|rollback_kong_standby|run_kong_standby_acceptance|validate_kong_production_standby|reconcile_kong_(callback_routes|campaign_automation|canonical_routes)|export_kong_public_route_contracts)' \
            -- .github tools tests deploy operations scripts config \
            ':!config/kong-source.lock.json' \
            ':!tools/verify_kong_source_lock.py'
          then
            echo 'Active platform source still references moved Kong implementation paths.'
            exit 1
          fi

      - name: Commit platform source boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'refactor: move Kong source authority to standalone repository'
          git push origin HEAD:refactor/extract-kong-source-authority-20260826
