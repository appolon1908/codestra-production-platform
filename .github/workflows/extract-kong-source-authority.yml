name: Extract Kong source ownership from platform

on:
  push:
    branches:
      - refactor/extract-kong-source-authority-20260826
    paths:
      - .github/workflows/extract-kong-source-authority.yml

permissions:
  contents: write

concurrency:
  group: extract-kong-source-authority
  cancel-in-progress: false

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Remove duplicate Kong implementation and add pinned source lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          import shutil
          from pathlib import Path

          root = Path('.')

          for directory in (
              'deploy/kong',
              'deploy/kong-production-standby',
              'operations/kong-database',
          ):
              path = root / directory
              if path.exists():
                  shutil.rmtree(path)

          for relative in (
              'config/kong-callback-routes.json',
              'config/kong-campaign-automation-routes.json',
              'config/kong-canonical-middleware-routes.json',
              'operations/runbooks/kong-production-activation.md',
              'operations/runbooks/kong-production-rollback.md',
              'scripts/apply_kong_standby.py',
              'scripts/export_kong_public_route_contracts.py',
              'scripts/reconcile_kong_callback_routes.py',
              'scripts/reconcile_kong_campaign_automation.py',
              'scripts/reconcile_kong_canonical_routes.py',
              'scripts/rollback_kong_standby.py',
              'scripts/run_kong_standby_acceptance.py',
              'scripts/validate_kong_production_standby.py',
              'tests/test_kong_change_authority.py',
              'tests/test_kong_database_operations.py',
              'tests/test_kong_canonical_route_contract.py',
              'tests/test_kong_route_authority_hardening.py',
          ):
              path = root / relative
              if path.exists():
                  path.unlink()

          lock = {
              'schema': 'codestra.platform.external-source-lock.v1',
              'component': 'kong-gateway',
              'repository': 'appolon1908-hue/Kong',
              'commit': '007055bbd05b9cd1c7cc33d3810ec17a3ec9fbba',
              'manifest_path': 'MIGRATION_MANIFEST.json',
              'manifest_schema': 'codestra.kong.repository-migration.v1',
              'source_platform_sha': 'f3a16308194378a7b1580e04943dc98d64619077',
              'source_route_pr': 130,
              'source_route_sha': 'b340023f5e74e1f9154fc97590c9b6a48caa8b99',
              'required_paths': [
                  'deploy/kong/control-plane.yml',
                  'deploy/kong/scope-policy.lua',
                  'deploy/kong-production-standby/compose.standby.yaml',
                  'operations/kong-database/README.md',
                  'scripts/reconcile_kong_canonical_routes.py',
                  'tests/test_kong_route_authority_hardening.py',
              ],
              'public_routes': [
                  {
                      'service': 'codestra-control-plane',
                      'route': 'control-plane-control',
                      'methods': ['PATCH', 'POST'],
                      'paths': ['/api/v1/control'],
                      'hosts': ['api.codestra.co'],
                  },
                  {
                      'service': 'codestra-control-plane',
                      'route': 'communication-message-read',
                      'methods': ['GET'],
                      'paths': ['/api/v1/messages'],
                      'hosts': ['api.codestra.co'],
                  },
                  {
                      'service': 'codestra-control-plane',
                      'route': 'control-plane-events',
                      'methods': ['POST'],
                      'paths': ['/api/v1/events'],
                      'hosts': ['api.codestra.co'],
                  },
                  {
                      'service': 'codestra-control-plane',
                      'route': 'control-plane-results',
                      'methods': ['POST'],
                      'paths': ['/api/v1/results'],
                      'hosts': ['api.codestra.co'],
                  },
                  {
                      'service': 'codestra-control-plane',
                      'route': 'control-plane-reconciliation',
                      'methods': ['GET', 'POST'],
                      'paths': ['/api/v1/reconciliation'],
                      'hosts': ['api.codestra.co'],
                  },
                  {
                      'service': 'codestra-control-plane',
                      'route': 'control-plane-health',
                      'methods': ['GET'],
                      'paths': ['/api/v1/health'],
                      'hosts': ['api.codestra.co'],
                  },
                  {
                      'service': 'codestra-control-plane',
                      'route': 'control-plane-system-admin',
                      'methods': ['GET'],
                      'paths': ['/v1/admin/system'],
                      'hosts': ['api.codestra.co'],
                  },
              ],
              'security_contracts': {
                  'system_admin_required_scope': 'platform.admin',
                  'authenticated_role_headers': ['platform_admin', 'tenant_admin'],
              },
              'local_implementation_paths_must_be_absent': [
                  'deploy/kong',
                  'deploy/kong-production-standby',
                  'operations/kong-database',
                  'config/kong-callback-routes.json',
                  'config/kong-campaign-automation-routes.json',
                  'config/kong-canonical-middleware-routes.json',
              ],
              'production_state_changed': False,
          }
          (root / 'config/kong-source.lock.json').write_text(
              json.dumps(lock, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          verifier = r'''#!/usr/bin/env python3
          """Verify the pinned standalone Kong source authority."""

          from __future__ import annotations

          import argparse
          import json
          import re
          import urllib.request
          from pathlib import Path
          from typing import Any

          import yaml

          ROOT = Path(__file__).resolve().parents[1]
          LOCK_PATH = ROOT / "config/kong-source.lock.json"
          SHA40 = re.compile(r"^[0-9a-f]{40}$")


          def load_lock(path: Path = LOCK_PATH) -> dict[str, Any]:
              value = json.loads(path.read_text(encoding="utf-8"))
              assert value["schema"] == "codestra.platform.external-source-lock.v1"
              assert value["component"] == "kong-gateway"
              assert value["repository"] == "appolon1908-hue/Kong"
              assert SHA40.fullmatch(value["commit"])
              assert SHA40.fullmatch(value["source_platform_sha"])
              assert SHA40.fullmatch(value["source_route_sha"])
              assert value["production_state_changed"] is False
              return value


          def verify_local_absence(lock: dict[str, Any], root: Path = ROOT) -> None:
              unexpected = [
                  relative
                  for relative in lock["local_implementation_paths_must_be_absent"]
                  if (root / relative).exists()
              ]
              if unexpected:
                  raise SystemExit("duplicated Kong source remains in platform: " + ",".join(unexpected))


          def fetch_text(url: str) -> str:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "codestra-platform-kong-source-lock/1"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.read().decode("utf-8")


          def normalized_routes(document: dict[str, Any]) -> list[dict[str, Any]]:
              rows: list[dict[str, Any]] = []
              for service in document.get("services", []):
                  for route in service.get("routes", []):
                      rows.append(
                          {
                              "service": service.get("name"),
                              "route": route.get("name"),
                              "methods": sorted(route.get("methods", ["ANY"])),
                              "paths": sorted(route.get("paths", [])),
                              "hosts": sorted(route.get("hosts", [])),
                          }
                      )
              return sorted(rows, key=lambda row: (row["service"], row["route"]))


          def verify_online(lock: dict[str, Any]) -> None:
              base = f"https://raw.githubusercontent.com/{lock['repository']}/{lock['commit']}"
              manifest = json.loads(fetch_text(f"{base}/{lock['manifest_path']}"))
              assert manifest["schema"] == lock["manifest_schema"]
              assert manifest["target_repository"] == lock["repository"]
              assert manifest["source_protected_sha"] == lock["source_platform_sha"]
              assert manifest["source_route_sha"] == lock["source_route_sha"]
              available = {row["path"] for row in manifest["files"]}
              missing = sorted(set(lock["required_paths"]) - available)
              if missing:
                  raise SystemExit("standalone Kong source missing required paths: " + ",".join(missing))

              kong = yaml.safe_load(fetch_text(f"{base}/deploy/kong/control-plane.yml"))
              expected = sorted(lock["public_routes"], key=lambda row: (row["service"], row["route"]))
              if normalized_routes(kong) != expected:
                  raise SystemExit("standalone Kong public route contract differs from platform lock")

              scope_policy = fetch_text(f"{base}/deploy/kong/scope-policy.lua")
              security = lock["security_contracts"]
              assert security["system_admin_required_scope"] in scope_policy
              for role in security["authenticated_role_headers"]:
                  assert f'set_header("X-Authenticated-Role", "{role}")' in scope_policy


          def main() -> None:
              parser = argparse.ArgumentParser()
              parser.add_argument("--online", action="store_true")
              args = parser.parse_args()
              lock = load_lock()
              verify_local_absence(lock)
              if args.online:
                  verify_online(lock)
              print(
                  f"KONG_SOURCE_AUTHORITY=PASS REPOSITORY={lock['repository']} "
                  f"COMMIT={lock['commit']} ONLINE={'YES' if args.online else 'NO'}"
              )


          if __name__ == "__main__":
              main()
          '''
          verifier = '\n'.join(line[10:] if line.startswith('          ') else line for line in verifier.splitlines()) + '\n'
          path = root / 'tools/verify_kong_source_lock.py'
          path.write_text(verifier, encoding='utf-8')
          path.chmod(0o755)

          architecture = root / 'tools/check_integration_architecture.py'
          text = architecture.read_text(encoding='utf-8')
          old = '''    kong_path = root / "deploy/kong/control-plane.yml"
    if kong_path.exists():
        kong = load_yaml(kong_path)
        for service in kong.get("services", []):
            for route in service.get("routes", []):
                for path in route.get("paths", []):
                    for method in route.get("methods", ["ANY"]):
                        discovered.add((str(method).upper(), str(path), str(kong_path.relative_to(root))))
'''
          new = '''    kong_lock_path = root / "config/kong-source.lock.json"
    if kong_lock_path.exists():
        kong_lock = json.loads(kong_lock_path.read_text(encoding="utf-8"))
        for route in kong_lock.get("public_routes", []):
            for path in route.get("paths", []):
                for method in route.get("methods", ["ANY"]):
                    discovered.add((str(method).upper(), str(path), str(kong_lock_path.relative_to(root))))
'''
          if old not in text:
              raise SystemExit('unable to replace local Kong endpoint discovery')
          architecture.write_text(text.replace(old, new), encoding='utf-8')

          pytest_ini = root / 'pytest.ini'
          pytest_text = pytest_ini.read_text(encoding='utf-8')
          pytest_text = pytest_text.replace('    deploy/kong-production-standby/auth-middleware\n', '')
          pytest_ini.write_text(pytest_text, encoding='utf-8')

          for relative in (
              '.github/workflows/platform-source-gate.yml',
              '.github/workflows/protected-release.yml',
          ):
              path = root / relative
              value = path.read_text(encoding='utf-8')
              value = re.sub(
                  r'\n\s*python -m pytest -q \\\n\s*deploy/kong-production-standby/auth-middleware/test_token_validation\.py',
                  '\n          python tools/verify_kong_source_lock.py --online',
                  value,
              )
              path.write_text(value, encoding='utf-8')

          old_test = root / 'tests/test_kong_control_plane.py'
          if old_test.exists():
              old_test.unlink()
          platform_test = '''from pathlib import Path
          import hashlib

          from control_plane_service.server import Handler

          ROOT = Path(__file__).resolve().parents[1]


          def test_trusted_proxy_headers_also_require_gateway_secret(monkeypatch, tmp_path):
              secret = "synthetic-gateway-secret"
              verifier = tmp_path / "verifier"
              verifier.write_text(hashlib.sha256(secret.encode()).hexdigest())
              monkeypatch.setenv("CONTROL_PLANE_TRUSTED_PROXY_CIDRS", "10.0.0.2/32")
              monkeypatch.setenv("KONG_GATEWAY_SHARED_SECRET_SHA256_FILE", str(verifier))
              handler = Handler.__new__(Handler)
              handler.client_address = ("10.0.0.2", 1234)
              handler.headers = {
                  "X-Authenticated-Client": "n8n",
                  "X-Authenticated-Tenant": "COD",
              }
              denied = []
              handler.send_json = lambda code, value: denied.append((code, value))
              assert handler.auth_operator({"tenant_admin"}) is None
              assert denied[0][0] == 403
              handler.headers["X-Codestra-Gateway-Secret"] = secret
              assert handler.auth_operator({"tenant_admin"}) == ("n8n", "tenant_admin", "COD")
              assert handler.auth_operator({"platform_admin"}) is None
              handler.headers["X-Authenticated-Role"] = "platform_admin"
              assert handler.auth_operator({"platform_admin"}) == ("n8n", "platform_admin", "COD")


          def test_postgres_base_schema_precedes_runtime_and_mailbox_migrations():
              migration = (ROOT / "migrations/control_plane/000_runtime_store.sql").read_text()
              for table in ("events", "messages", "integrations", "circuits", "preferences", "suppressions"):
                  assert f"public.{table}" in migration


          def test_complete_granular_communication_scope_catalog_is_documented():
              matrix = (ROOT / "reports/COMMUNICATION_OAUTH_SCOPE_MATRIX.csv").read_text()
              required = {
                  "communications.message.create",
                  "communications.message.read",
                  "communications.message.dispatch",
                  "communications.message.events.read",
                  "communications.sms.create",
                  "communications.sms.dispatch",
                  "communications.sms.events.read",
                  "communications.email.create",
                  "communications.email.dispatch",
                  "communications.email.events.read",
                  "communications.result.write",
                  "communications.reconciliation.read",
                  "communications.reconciliation.execute",
                  "communications.admin",
              }
              assert not (required - set(matrix.replace(",", " ").replace('"', " ").split()))


          def test_control_plane_implements_business_aliases_without_provider_duplication():
              source = (ROOT / "control_plane_service/server.py").read_text()
              for path in ("/api/v1/control/messages", "/api/v1/messages/", "/api/v1/results/messages/"):
                  assert path in source
              assert "STORE.create_message(value)" in source


          def test_signed_provider_event_ids_are_single_use_nonces():
              source = (ROOT / "control_plane_service/server.py").read_text()
              assert 'source in {"odoo", "telnexa", "klyrow"}' in source
              assert '"replayed_event_id"' in source
          '''
          platform_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in platform_test.splitlines()) + '\n'
          (root / 'tests/test_control_plane_platform_contracts.py').write_text(platform_test, encoding='utf-8')

          health = root / 'tests/test_system_health_contract.py'
          value = health.read_text(encoding='utf-8')
          old_health = '''def test_kong_system_route_requires_platform_admin_scope_and_role_header():
    kong = (ROOT / "deploy/kong/control-plane.yml").read_text()
    assert "paths: [/v1/admin/system]" in kong
    assert 'required = "platform.admin"' in kong
    assert 'set_header("X-Authenticated-Role", "platform_admin")' in kong
    assert 'set_header("X-Authenticated-Role", "tenant_admin")' in kong
'''
          new_health = '''def test_kong_system_route_contract_is_pinned_to_standalone_authority():
    import json

    lock = json.loads((ROOT / "config/kong-source.lock.json").read_text())
    route = next(row for row in lock["public_routes"] if row["route"] == "control-plane-system-admin")
    assert route["methods"] == ["GET"]
    assert route["paths"] == ["/v1/admin/system"]
    assert route["hosts"] == ["api.codestra.co"]
    assert lock["security_contracts"]["system_admin_required_scope"] == "platform.admin"
    assert lock["security_contracts"]["authenticated_role_headers"] == ["platform_admin", "tenant_admin"]
'''
          if old_health not in value:
              raise SystemExit('unable to replace system route source assertion')
          health.write_text(value.replace(old_health, new_health), encoding='utf-8')

          lock_tests = '''import json
          from pathlib import Path

          from tools.verify_kong_source_lock import load_lock, verify_local_absence

          ROOT = Path(__file__).resolve().parents[1]


          def test_kong_source_lock_is_exact_and_fail_closed():
              lock = load_lock()
              assert lock["repository"] == "appolon1908-hue/Kong"
              assert lock["commit"] == "007055bbd05b9cd1c7cc33d3810ec17a3ec9fbba"
              assert lock["production_state_changed"] is False
              verify_local_absence(lock)


          def test_platform_keeps_only_cross_system_route_summary():
              lock = json.loads((ROOT / "config/kong-source.lock.json").read_text())
              assert len(lock["public_routes"]) == 7
              assert all(row["hosts"] == ["api.codestra.co"] for row in lock["public_routes"])
              assert not any((ROOT / relative).exists() for relative in lock["local_implementation_paths_must_be_absent"])
          '''
          lock_tests = '\n'.join(line[10:] if line.startswith('          ') else line for line in lock_tests.splitlines()) + '\n'
          (root / 'tests/test_kong_source_lock.py').write_text(lock_tests, encoding='utf-8')

          docs = root / 'docs/architecture'
          docs.mkdir(parents=True, exist_ok=True)
          (docs / 'kong-source-authority.md').write_text(
              '''# Kong source authority\n\nKong implementation and database operations are owned by\n`appolon1908-hue/Kong` at the immutable commit recorded in\n`config/kong-source.lock.json`.\n\nThe platform repository retains only the cross-system dependency contract, release\nlock, and verification tooling. It no longer owns Kong route manifests, plugin\nconfiguration, standby implementation, database roles, backup/PITR/HA scripts, or\nKong-specific tests.\n\nThis source move does not change the production topology:\n\n```text\npublic client -> host Caddy -> Docker upstream-gateway -> private Kong -> private services\n```\n\nUpdating the lock requires a reviewed Kong commit, passing standalone Kong CI, an\nupdated platform PR, and exact-head validation. Applying a Kong change to the live\nAdmin API remains a separate maintenance-window operation.\n''',
              encoding='utf-8',
          )

          architecture_doc = root / 'ARCHITECTURE.md'
          if architecture_doc.exists():
              architecture_text = architecture_doc.read_text(encoding='utf-8')
              marker = '## Kong source authority'
              if marker not in architecture_text:
                  architecture_text += (
                      '\n\n## Kong source authority\n\n'
                      'Kong implementation is maintained in `appolon1908-hue/Kong`. '
                      'This repository pins the approved commit in '
                      '`config/kong-source.lock.json` and retains only cross-system '
                      'integration metadata. See `docs/architecture/kong-source-authority.md`.\n'
                  )
                  architecture_doc.write_text(architecture_text, encoding='utf-8')
          PY

      - name: Validate extracted boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pytest pytest-subtests PyYAML requests nats-py==2.15.0 fastapi==0.141.1 'PyJWT[crypto]==2.13.0' 'psycopg[binary]==3.2.9'
          python3 tools/verify_kong_source_lock.py --online
          python3 -m compileall -q tools tests
          python3 -m pytest -q
          python3 tools/check_integration_architecture.py --evidence "${RUNNER_TEMP}/integration-architecture.json"
          git diff --check

          if git grep -nE \
            'deploy/kong(/|-production-standby)|operations/kong-database|scripts/(apply_kong_standby|rollback_kong_standby|run_kong_standby_acceptance|validate_kong_production_standby|reconcile_kong_(callback_routes|campaign_automation|canonical_routes)|export_kong_public_route_contracts)' \
            -- .github tools tests deploy operations scripts config ':!config/kong-source.lock.json' ':!tools/verify_kong_source_lock.py'
          then
            echo 'Active platform source still references moved Kong implementation paths.'
            exit 1
          fi

      - name: Commit platform source boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'refactor: move Kong source authority to standalone repository'
          git push origin HEAD:refactor/extract-kong-source-authority-20260826
