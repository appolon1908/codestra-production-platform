name: Extract Kong source ownership from platform

on:
  push:
    branches:
      - refactor/extract-kong-source-authority-20260826
    paths:
      - .github/workflows/extract-kong-source-authority.yml
      - tools/apply_kong_repository_extraction.py

permissions:
  contents: write

concurrency:
  group: extract-kong-source-authority
  cancel-in-progress: false

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Repair one-time extraction helper against current source formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_kong_repository_extraction.py")
          value = path.read_text(encoding="utf-8")
          start = value.index("def patch_architecture_validator() -> None:")
          end = value.index("\n\ndef patch_workflows() -> None:", start)
          replacement = r'''def patch_architecture_validator() -> None:
              path = ROOT / "tools/check_integration_architecture.py"
              value = path.read_text(encoding="utf-8")
              block_start = value.index(
                  '    kong_path = root / "deploy/kong/control-plane.yml"'
              )
              block_end = value.index("\n    caddy_path =", block_start)
              new = (
                  '    kong_lock_path = root / "config/kong-source.lock.json"\n'
                  '    if kong_lock_path.exists():\n'
                  '        kong_lock = json.loads(\n'
                  '            kong_lock_path.read_text(encoding="utf-8")\n'
                  '        )\n'
                  '        for route in kong_lock.get("public_routes", []):\n'
                  '            for route_path in route.get("paths", []):\n'
                  '                for method in route.get("methods", ["ANY"]):\n'
                  '                    discovered.add(\n'
                  '                        (\n'
                  '                            str(method).upper(),\n'
                  '                            str(route_path),\n'
                  '                            str(kong_lock_path.relative_to(root)),\n'
                  '                        )\n'
                  '                    )'
              )
              path.write_text(
                  value[:block_start] + new + value[block_end:], encoding="utf-8"
              )
          '''
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          )
          path.write_text(value[:start] + replacement + value[end:], encoding="utf-8")
          PY

      - name: Apply repository ownership boundary
        run: python3 tools/apply_kong_repository_extraction.py

      - name: Finalize platform consumer contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          # These tests exercise Kong-owned implementations and belong only in
          # the standalone Kong repository after this source boundary is applied.
          for relative in (
              "tests/test_kong_campaign_automation.py",
              "tests/test_kong_production_standby.py",
          ):
              Path(relative).unlink(missing_ok=True)

          # Keep the platform-owned Odoo identity and disabled-delivery tests, but
          # replace direct imports of moved Kong files with the immutable repo lock.
          callback = Path("tests/test_odoo_callback_control_path.py")
          value = callback.read_text(encoding="utf-8")
          value = value.replace(
              'KONG = json.loads(Path("config/kong-callback-routes.json").read_text())\n'
              'RECONCILER = Path("scripts/reconcile_kong_callback_routes.py").read_text()\n',
              'KONG_LOCK = json.loads(Path("config/kong-source.lock.json").read_text())\n',
          )
          start = value.index("def test_kong_exposes_only_required_callback_surfaces():")
          end = value.index(
              "\n\ndef test_deployment_keeps_every_broad_delivery_path_disabled():",
              start,
          )
          replacement = '''def test_kong_callback_contract_is_pinned_to_standalone_authority():
              assert KONG_LOCK["repository"] == "appolon1908-hue/Kong"
              assert KONG_LOCK["commit"] == "007055bbd05b9cd1c7cc33d3810ec17a3ec9fbba"
              assert KONG_LOCK["production_state_changed"] is False
              assert "config/kong-callback-routes.json" in KONG_LOCK["required_paths"]
              assert "config/kong-campaign-automation-routes.json" in KONG_LOCK["required_paths"]
          '''
          replacement = "\n".join(
              line[14:] if line.startswith("              ") else line
              for line in replacement.splitlines()
          )
          callback.write_text(
              value[:start] + replacement + value[end:], encoding="utf-8"
          )

          lock_path = Path("config/kong-source.lock.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          required = set(lock["required_paths"])
          required.update(
              {
                  "config/kong-callback-routes.json",
                  "config/kong-campaign-automation-routes.json",
              }
          )
          lock["required_paths"] = sorted(required)
          lock_path.write_text(
              json.dumps(lock, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          # The extraction workflow is one-time migration scaffolding. Do not
          # retain a self-mutating workflow in the protected platform source.
          Path(".github/workflows/extract-kong-source-authority.yml").unlink()
          PY

          # Stage the complete ownership-boundary change before tests. Release
          # bundle tooling uses git ls-files and must observe staged deletions.
          git add --all
          git diff --cached --check

      - name: Install platform test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nats-server
          python3 -m pip install --disable-pip-version-check \
            pytest pytest-subtests PyYAML requests nats-py==2.15.0 \
            fastapi==0.141.1 'PyJWT[crypto]==2.13.0' 'psycopg[binary]==3.2.9'

      - name: Validate extracted boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_kong_source_lock.py --online
          python3 -m compileall -q tools tests
          python3 -m pytest -q
          python3 tools/check_integration_architecture.py \
            --evidence "${RUNNER_TEMP}/integration-architecture.json"
          git diff --check

          if git grep -nE \
            'deploy/kong(/|-production-standby)|operations/kong-database|scripts/(apply_kong_standby|rollback_kong_standby|run_kong_standby_acceptance|validate_kong_production_standby|reconcile_kong_(callback_routes|campaign_automation|canonical_routes)|export_kong_public_route_contracts)' \
            -- .github tools tests deploy operations scripts config \
            ':!config/kong-source.lock.json' \
            ':!tools/verify_kong_source_lock.py'
          then
            echo 'Active platform source still references moved Kong implementation paths.'
            exit 1
          fi

      - name: Commit platform source boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'refactor: move Kong source authority to standalone repository'
          git push origin HEAD:refactor/extract-kong-source-authority-20260826
