name: Integration architecture recertification

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/production-activation
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Fail closed on architecture violation
        run: python tools/check_integration_architecture.py --evidence integration-architecture.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-architecture-${{ github.run_id }}-${{ github.run_attempt }}
          path: integration-architecture.json
          if-no-files-found: error
          retention-days: 90
