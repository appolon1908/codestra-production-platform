  middleware-n8n-runtime-worker: *approved-middleware
  middleware-social-n8n-delivery-worker: *approved-middleware
  middleware-postly-polling-worker: *approved-middleware
  middleware-policy-engine: *approved-middleware
  middleware-extension-allocator: *approved-middleware
  middleware-telephony-provisioning: *approved-middleware
  middleware-pjsip-adapter: *approved-middleware
  middleware-reconciliation-worker: *approved-middleware
  middleware-notification-worker: *approved-middleware
  middleware-evidence-runner: *approved-middleware
  middleware-vicidial-adapter: *approved-middleware
  middleware-webphone-session-issuer: *approved-middleware
  middleware-scheduler: *approved-middleware
  middleware-sync-worker: *approved-middleware
