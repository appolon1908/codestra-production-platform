services:
  odoo:
    secrets:
      - source: codestra_call_followup_automation_api_key
        target: codestra_call_followup_automation_api_key
        mode: 0444
      - source: codestra_call_followup_automation_webhook_secret
        target: codestra_call_followup_automation_webhook_secret
        mode: 0444

secrets:
  codestra_call_followup_automation_api_key:
    file: ${ODOO_CALL_FOLLOWUP_AUTOMATION_API_KEY_FILE:?host API-key secret file required}
  codestra_call_followup_automation_webhook_secret:
    file: ${ODOO_CALL_FOLLOWUP_AUTOMATION_WEBHOOK_SECRET_FILE:?host HMAC secret file required}
