services:
  odoo:
    command:
      - odoo
      - --database=odoo19_module_staging
      - --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/integration-addons,/mnt/call-center-addons,/mnt/vertical-addons,/mnt/crm-call-followup-addons
      - --max-cron-threads=0
      - --workers=0
      - --http-interface=0.0.0.0
      - --without-demo=true
    volumes:
      # The staging database has call_center_campaign 19.0.3.0.2 installed.
      # Fail closed on its immutable source so installing another addon cannot
      # accidentally revalidate CRM views against the older mutable checkout.
      - ${ODOO_CALL_CENTER_ADDON_RELEASE:?exact reviewed call-center addon release directory required}/call_center_campaign:/mnt/call-center-addons/call_center_campaign:ro
      - ${ODOO_CRM_CALL_FOLLOWUP_ADDON_RELEASE:?exact reviewed addon release directory required}/codestra_crm_call_followup:/mnt/crm-call-followup-addons/codestra_crm_call_followup:ro
      # The staging database already has codestra_mail_inbox installed. Keep its
      # independently reviewed release visible so registry validation cannot
      # silently proceed with a missing installed module.
      - ${ODOO_CRM_CALL_FOLLOWUP_STAGING_MAIL_INBOX_RELEASE:?exact reviewed mail inbox release directory required}/codestra_mail_inbox:/mnt/vertical-addons/codestra_mail_inbox:ro
