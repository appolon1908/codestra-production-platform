name: codestra-integration-control-plane
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile
    restart: unless-stopped
    env_file: ${CONTROL_PLANE_ENV_FILE:-/etc/codestra/secrets/control-plane.env}
    environment:
      CONTROL_PLANE_BIND: 0.0.0.0
      CONTROL_PLANE_PORT: 8096
      CONTROL_PLANE_DB: /data/control-plane.db
      CONTROL_PLANE_OUTBOUND_ENABLED: "false"
    ports: ["127.0.0.1:8096:8096"]
    volumes: [control_plane_data:/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/health')"]
      interval: 20s
      timeout: 3s
      retries: 5
  worker:
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile
    command: [python, -m, control_plane_service.worker]
    restart: unless-stopped
    env_file: ${CONTROL_PLANE_ENV_FILE:-/etc/codestra/secrets/control-plane.env}
    environment:
      CONTROL_PLANE_DB: /data/control-plane.db
      CONTROL_PLANE_OUTBOUND_ENABLED: "false"
    volumes: [control_plane_data:/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    healthcheck:
      disable: true
volumes:
  control_plane_data:
networks:
  edge:
    name: codestra_edge
    external: true
