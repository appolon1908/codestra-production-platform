provider = "oidc"
provider_display_name = "Codestra"
oidc_issuer_url = "https://auth.codestra.agency/realms/codestra"
skip_oidc_discovery = true
login_url = "https://auth.codestra.agency/realms/codestra/protocol/openid-connect/auth"
redeem_url = "http://keycloak:8080/realms/codestra/protocol/openid-connect/token"
oidc_jwks_url = "http://keycloak:8080/realms/codestra/protocol/openid-connect/certs"
redirect_url = "https://crm.codestra.agency/reseller/oauth2/callback"
upstreams = ["http://portal:8080"]
http_address = "0.0.0.0:4180"
code_challenge_method = "S256"
scope = "openid email profile"
oidc_email_claim = "sub"
cookie_name = "__Host-codestra_portal_oidc"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "strict"
cookie_path = "/"
cookie_expire = "1h"
cookie_refresh = "5m"
session_store_type = "cookie"
email_domains = ["*"]
skip_provider_button = true
pass_user_headers = true
set_xauthrequest = true
reverse_proxy = true
trusted_proxy_ips = ["172.19.0.0/16"]
whitelist_domains = ["crm.codestra.agency"]
footer = "-"
