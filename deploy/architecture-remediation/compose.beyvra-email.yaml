# Apply only to the codestra-beyvra-email project. Database reachability is
# retained through codestra-provider-email, which is also attached to the
# central PostgreSQL service by compose.core-provider-networks.yaml.
services:
  api:
    networks: !reset [provider_email]
  worker:
    networks: !reset [provider_email]
networks:
  provider_email: {name: codestra-provider-email, external: true}
