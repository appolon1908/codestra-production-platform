name: codestra-kong

# Canonical database portion of the production Kong runtime. The deployment
# system supplies KONG_PG_PASSWORD without committing it to Git.
services:
  kong-db:
    image: postgres@sha256:0b657ff48d7f76a1e907f381b1693eb4f2bf54c1d2df4feb6743d7dc601768dd
    restart: unless-stopped
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: ${KONG_PG_PASSWORD:?required}
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    networks:
      kong_backend:
        ipv4_address: 10.254.42.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

volumes:
  kong_db_data:
    name: codestra-kong_kong_db_data

networks:
  kong_backend:
    name: codestra-kong_kong_backend
    internal: true
    ipam:
      config:
        - subnet: 10.254.42.0/28
