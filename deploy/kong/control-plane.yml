_format_version: "3.0"
_transform: true
services:
  - name: codestra-control-plane
    url: http://codestra-control-plane:8096
    connect_timeout: 3000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: control-plane-control
        hosts: [api.codestra.co]
        paths: [/api/v1/control]
        methods: [GET, POST]
        strip_path: false
      - name: control-plane-events
        hosts: [api.codestra.co]
        paths: [/api/v1/events]
        methods: [POST]
        strip_path: false
      - name: control-plane-results
        hosts: [api.codestra.co]
        paths: [/api/v1/results]
        methods: [POST]
        strip_path: false
      - name: control-plane-reconciliation
        hosts: [api.codestra.co]
        paths: [/api/v1/reconciliation]
        methods: [GET, POST]
        strip_path: false
      - name: control-plane-health
        hosts: [api.codestra.co]
        paths: [/api/v1/health]
        methods: [GET]
        strip_path: false
    plugins:
      - name: openid-connect
        config:
          issuer: https://auth.codestra.co/realms/codestra/.well-known/openid-configuration
          auth_methods: [bearer]
          audience: [codestra-control-plane]
          scopes_required: [openid]
          consumer_claim: [azp]
      - name: request-size-limiting
        config: {allowed_payload_size: 1, size_unit: megabytes, require_content_length: true}
      - name: rate-limiting
        config: {minute: 120, policy: local, fault_tolerant: false, hide_client_headers: false}
      - name: correlation-id
        config: {header_name: X-Correlation-ID, generator: uuid, echo_downstream: true}
# Scope enforcement is performed by the pre-function policy installed from
# deploy/kong/scope-policy.lua. Consumers remain separate Keycloak clients.
