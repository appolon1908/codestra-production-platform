services:
  kong-gateway:
    environment:
      KONG_PLUGINS: bundled,codestra-gateway-identity
    secrets:
      - control_plane_gateway_secret
    volumes:
      - ./plugins/codestra-gateway-identity:/usr/local/share/lua/5.1/kong/plugins/codestra-gateway-identity:ro

secrets:
  control_plane_gateway_secret:
    file: /etc/codestra/secrets/control-plane-gateway/shared-secret
