# Git authority for the private Telnexa integration edge. Certificate paths
# are stable release symlinks; no private key material belongs in Git.
server {
    listen 10.40.0.4:8443 ssl;
    server_name telnexa.internal.codestra.agency;

    ssl_certificate /etc/codestra/mtls/provider/telnexa/current/server-fullchain.crt;
    ssl_certificate_key /etc/codestra/mtls/provider/telnexa/current/server.key;
    ssl_client_certificate /etc/codestra/mtls/provider/telnexa/current/client-ca.crt;
    ssl_crl /etc/codestra/mtls/provider/telnexa/current/client.crl;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Routine renewal preserves the exact subject while the dedicated client
    # CA and CRL provide issuance and revocation authority. Serial is logged,
    # not pinned, because the supported renewal workflow rotates it.
    if ($ssl_client_s_dn !~ "^CN=middleware-telnexa-client$") { return 403; }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Client-Certificate-Verified $ssl_client_verify;
        proxy_set_header X-Client-Certificate-Subject $ssl_client_s_dn;
        proxy_set_header X-Client-Certificate-Serial $ssl_client_serial;
        # Never trust caller-supplied service identity or authorization scopes.
        # This edge is pinned to the independently approved Telnexa identity.
        proxy_set_header X-Service-Identity telnexa;
        proxy_set_header X-Service-Scope "capabilities:read integrations:sms:commands metrics:read operations:read operations:cancel operations:reconcile";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:18443;
    }
}
