# Restart-required settings. Deploy only after the authority validator returns GO.
wal_level = 'replica'
archive_mode = 'on'
archive_command = '/usr/local/sbin/codestra-shared-postgres-stage-wal.sh %p %f'
archive_timeout = '60s'
max_wal_senders = 10
max_replication_slots = 10
wal_compression = 'on'
