name: codestra-monitoring

services:
  prometheus:
    image: prom/prometheus@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks: [monitoring]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: [CMD, /bin/promtool, check, healthy]
      interval: 30s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - /etc/codestra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./templates:/etc/alertmanager/templates:ro
      - /etc/codestra/secrets/monitoring/primary_receiver_url:/run/secrets/alertmanager_primary_receiver_url:ro
      - /etc/codestra/secrets/monitoring/secondary_receiver_url:/run/secrets/alertmanager_secondary_receiver_url:ro
      - /etc/codestra/secrets/monitoring/recovery_receiver_url:/run/secrets/alertmanager_recovery_receiver_url:ro
      - /etc/codestra/secrets/monitoring/rejected_route_url:/run/secrets/alertmanager_rejected_route_url:ro
      - alertmanager_data:/alertmanager
    networks: [monitoring]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command:
      - --path.rootfs=/host
      - --collector.systemd
      - --collector.processes
    volumes:
      - /:/host:ro,rslave
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
    pid: host
    networks: [monitoring]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    privileged: false
    devices: [/dev/kmsg:/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [monitoring]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [monitoring]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

networks:
  monitoring:
    internal: false

volumes:
  prometheus_data: {}
  alertmanager_data: {}
