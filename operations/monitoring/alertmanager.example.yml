global:
  resolve_timeout: 5m

route:
  receiver: approved-operations-receiver
  group_by: [alertname, environment, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      repeat_interval: 30m

receivers:
  - name: approved-operations-receiver
    webhook_configs:
      - url: https://REPLACE_WITH_APPROVED_ALERT_RECEIVER.invalid/codestra
        send_resolved: true

