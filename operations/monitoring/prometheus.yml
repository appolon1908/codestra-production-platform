global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: codestra_production_like
    host: middleware

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: websocket_gateway
    metrics_path: /metrics
    static_configs:
      - targets: [codestra-websocket-gateway-gateway-1:8080]
        labels:
          websocket_role: primary
      - targets: [websocket-standby:8080]
        labels:
          websocket_role: standby

  - job_name: websocket_readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [https://api.codestra.agency/readyz]
        labels:
          websocket_role: primary
      - targets: [http://websocket-standby:8080/readyz]
        labels:
          websocket_role: standby
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox_https
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://api.codestra.co/healthz
          - https://crm.codestra.agency/web/health
          - https://n8n-staging.codestra.agency/healthz
          - https://phone.codestra.agency/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox_tls
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://api.codestra.co/healthz
          - https://crm.codestra.agency/web/health
          - https://n8n-staging.codestra.agency/healthz
          - https://phone.codestra.agency/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
