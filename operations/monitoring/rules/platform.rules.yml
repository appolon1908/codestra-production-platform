      current_value: '{{ $value }}'
      threshold: 3 restarts / 15m
      threshold_status: candidate_requires_post_deployment_tuning
      runbook: operations/runbooks/alerts/middleware-restart-loop.md
      runbook_url: https://runbooks.codestra.agency/alerts/middleware-restart-loop
      dashboard: monitoring-evidence://application/middleware-restart-loop
