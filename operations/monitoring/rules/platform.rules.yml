groups:
- name: application
  rules:
  - alert: CodestraMiddlewareUnavailable
    expr: codestra_service_up{service="middleware"} == 0
    for: 2m
    labels:
      severity: critical
      service: middleware
      environment: production
      owner_ref: monitoring-owner-registry
    annotations:
      summary: Middleware is unavailable
      description: Middleware is unavailable. Investigate using the linked runbook; preserve safety interlocks and evidence.
      current_value: '{{ $value }}'
      threshold: service_up = 0
      threshold_status: candidate_requires_post_deployment_tuning
      runbook: operations/runbooks/alerts/middleware-unavailable.md
      runbook_url: https://runbooks.codestra.agency/alerts/middleware-unavailable
      dashboard: monitoring-evidence://application/middleware-unavailable
  - alert: CodestraMiddlewareRestartLoop
    expr: increase(codestra_service_restarts_total{service="middleware"}[15m]) >= 3
    for: 5m
    labels:
      severity: critical
      service: middleware
      environment: production
      owner_ref: monitoring-owner-registry
    annotations:
      summary: Middleware is restarting repeatedly
