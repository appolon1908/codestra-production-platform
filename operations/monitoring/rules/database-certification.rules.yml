groups:
  - name: codestra-database-certification
    rules:
      - alert: CodestraCentralBackupMissing
        expr: absent(codestra_database_backup_evidence_valid) or codestra_database_backup_evidence_valid != 1
        for: 10m
        labels: {severity: critical, service: central-backup}
        annotations:
          summary: Codestra central backup evidence is missing or invalid
          description: The fail-closed backup evidence metric is absent or not PASS.
      - alert: CodestraCentralBackupStale
        expr: codestra_database_backup_age_seconds > 108000
        for: 15m
        labels: {severity: critical, service: central-backup}
        annotations:
          summary: Codestra central backup is older than 30 hours
          description: Repair the backup before approving further production changes.
      - alert: CodestraOffHostRestoreMissing
        expr: absent(codestra_database_restore_evidence_valid) or codestra_database_restore_evidence_valid != 1
        for: 30m
        labels: {severity: critical, service: disaster-recovery}
        annotations:
          summary: No valid isolated off-host restore evidence is available
          description: Production certification requires a restore from the encrypted off-host copy.
      - alert: CodestraOffHostRestoreStale
        expr: codestra_database_restore_age_seconds > 691200
        for: 1h
        labels: {severity: warning, service: disaster-recovery}
        annotations:
          summary: Codestra restore rehearsal is older than eight days
          description: Run the isolated recovery exercise and verify all restored applications.
      - alert: CodestraKeycloakRestoredStartupFailed
        expr: absent(codestra_keycloak_restored_startup_success) or codestra_keycloak_restored_startup_success != 1
        for: 30m
        labels: {severity: critical, service: keycloak}
        annotations:
          summary: Keycloak has not started successfully against restored identity data
          description: Identity recovery is not certified until this gate is PASS.
      - alert: CodestraOffHostBackupVerificationFailed
        expr: absent(codestra_database_backup_offhost_verified) or codestra_database_backup_offhost_verified != 1
        for: 10m
        labels: {severity: critical, service: central-backup}
        annotations:
          summary: Codestra off-host backup verification is not PASS
          description: The encrypted artifact must upload and pass remote checksum readback.
      - alert: CodestraImmutableRetentionEvidenceFailed
        expr: absent(codestra_database_backup_immutable_retention_verified) or codestra_database_backup_immutable_retention_verified != 1
        for: 10m
        labels: {severity: critical, service: disaster-recovery}
        annotations:
          summary: Codestra immutable retention evidence is absent, stale, or failed
          description: Confirm object lock, WORM, or immutable snapshot retention and deletion protection.
      - alert: CodestraN8nCredentialRecoveryFailed
        expr: absent(codestra_n8n_credential_recovery_success) or codestra_n8n_credential_recovery_success != 1
        for: 30m
        labels: {severity: critical, service: n8n}
        annotations:
          summary: n8n credential recovery is not proven
          description: Restore the off-host database and prove credential decryption inside the no-egress rehearsal network.
