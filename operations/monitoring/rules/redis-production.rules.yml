groups:
  - name: redis-production
    rules:
      - alert: RedisExporterMissing
        expr: absent(up{job="redis"})
        for: 2m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: Redis exporter target is absent
      - alert: RedisDown
        expr: absent(redis_up{job="redis"}) or redis_up{job="redis"} != 1
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: Redis is unavailable to the restricted exporter

      - alert: RedisAuthenticationFailure
        expr: redis_exporter_last_scrape_error{job="redis",err=~".*(NOAUTH|WRONGPASS|authentication).*"} > 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: Redis monitoring authentication failed

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total{job="redis"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: Redis rejected client connections

      - alert: RedisBlockedClients
        expr: redis_blocked_clients{job="redis"} > 0
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: Redis has blocked clients

      - alert: RedisMemoryWarning
        expr: redis_memory_used_bytes{job="redis"} / clamp_min(redis_memory_max_bytes{job="redis"}, 1) > 0.70
        for: 10m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: Redis memory utilization exceeds 70 percent

      - alert: RedisMemoryCritical
        expr: redis_memory_used_bytes{job="redis"} / clamp_min(redis_memory_max_bytes{job="redis"}, 1) > 0.85
        for: 5m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: Redis memory utilization exceeds 85 percent

      - alert: RedisEvictions
        expr: increase(redis_evicted_keys_total{job="redis"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: Redis is evicting keys

      - alert: RedisAOFFailure
        expr: redis_aof_enabled{job="redis"} == 1 and (redis_aof_last_write_status{job="redis"} != 1 or redis_aof_last_bgrewrite_status{job="redis"} != 1)
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: Redis AOF persistence failed

      - alert: RedisRDBFailure
        expr: redis_rdb_last_bgsave_status{job="redis"} != 1
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: Redis RDB persistence failed

      - alert: RedisPersistenceStale
        expr: redis_rdb_changes_since_last_save{job="redis"} > 0 and time() - redis_rdb_last_save_timestamp_seconds{job="redis"} > 86400
        for: 15m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: Redis has unsaved changes and stale RDB state

      - alert: RedisUnexpectedReplicaState
        expr: redis_connected_slaves{job="redis"} != 0
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: Redis replica topology differs from the approved standalone policy
