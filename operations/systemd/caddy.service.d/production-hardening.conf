[Service]
# Restart on ordinary non-zero exits as well as signals/timeouts.
Restart=on-failure
RestartSec=5s

# Keep runtime-created files private and constrain kernel-facing features that
# the Caddy edge service does not need.
UMask=0027
ProtectHostname=true
RestrictRealtime=true
RemoveIPC=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ProcSubset=pid
ProtectProc=invisible
